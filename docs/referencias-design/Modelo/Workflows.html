  <!-- Templates -->
  <!-- Suggest - Standard Template -->
  <script type="text/ng-template" id="template/typeahead/typeahead-match.html">
      <a class="matching" tabindex="-1" bind-html-unsafe="'<span ng-show=\'false\'>'+ match.model.typeName + '</span> <span> ' + (match.model.type === 'ADD_ITEM' ? 'Adicionar ' : '') + (match.label | typeaheadHighlight:query)+ '</span>'"></a>
    </script>

  <script type="text/ng-template" id="template/typeahead/typeahead-popup.html">
      <ul class="suggest-list" ng-class="{'suggest-w-type': matches.length > 0 && matches[0].model.typeName.length > 0 }" ng-style="{display: isOpen()&&'block' || 'none', top: position.top+'px', left: position.left+'px'}"><li ng-repeat="match in matches" ng-class="{active: isActive($index), 'add-matching': match.model.type === 'ADD_ITEM'}" ng-mouseenter="selectActive($index)" ng-click="selectMatch($index)"><div st-typeahead-match index="$index" match="match" query="query"></div></li></ul>
    </script>

  <!-- Suggest  Case - Custom Template -->
  <script type="text/ng-template" id="template/casetypeahead.html">
      <div in-view="mustShow = $inview">
      	<div ng-show="mustShow">
      		<a class="matching" tabindex="-1" bind-html-unsafe="::('<div><span> ' + (match.label | typeaheadHighlight:query)+ '</span></div>')">
      		</a>
      		<a class="matching" ng-show="::(match.model.lawsuitNumber != null)" tabindex="-1" bind-html-unsafe="::('<div><span> ' + (match.model.lawsuitNumber | typeaheadHighlight:query)+ '</span></div>')">
      		</a>
      		<span ng-show="::(match.model.file != null)" tabindex="-1" bind-html-unsafe="::('<div><span class=\'alt\'> ' + (match.model.file | typeaheadHighlight:query)+ '</span></div>')">
      		</span>
      		<span ng-show="::(match.model.customerName != null)" tabindex="-1" bind-html-unsafe="::('<div><span class=\'alt\'> ' + (match.model.customerName | typeaheadHighlight:query)+ '</span></div>')">
      		</span>
      		<span ng-show="::(match.model.firstStakeholderName != null)" tabindex="-1" bind-html-unsafe="::('<div><span class=\'alt\'> ' + (match.model.firstStakeholderName | typeaheadHighlight:query)+ '</span></div>')">
      		</span>
      	</div>
      <div>
    </script>

  <!-- Suggest Responsible - Custom Template -->
  <script type="text/ng-template" id="template/responsibletypeahead.html">
      <a class="matching" tabindex="-1" bind-html-unsafe="'<div><span> ' + (match.label | typeaheadHighlight:query)+ '</span></div>'">
      </a>
      <span ng-show="match.model.email != null" tabindex="-1" bind-html-unsafe="'<div><span class=\'alt\'> ' + (match.model.email | typeaheadHighlight:query)+ '</span></div>'">
      </span>
    </script>

  <!-- Datepicker -->
  <script type="text/ng-template" id="template/datepicker/datepicker.html">
      <div ng-switch="datepickerMode" role="application" ng-keydown="keydown($event)"><daypicker ng-switch-when="day" tabindex="0"></daypicker></div>
    </script>
  <script type="text/ng-template" id="template/datepicker/popup.html">
      <div class="datepicker" ng-style="{display: (isOpen && 'block') || 'none', top: position.top+'px', left: position.left+'px'}" ng-keydown="keydown($event)" ng-transclude></div>
    </script>
  <script type="text/ng-template" id="template/datepicker/day.html">
      <div><table cellspacing="0"><thead><tr class="datepicker-months"><th><i class="fa fa-angle-double-left" ng-click="move(-1)"></i></th><th colspan="{{rows[0].length - 2 + showWeekNumbers}}"><strong>{{title}}</strong></th><th><i class="fa fa-angle-double-right" ng-click="move(1)"></i></th></tr><tr class="datepicker-weeks" ng-show="labels.length > 0"><th ng-repeat="label in labels track by $index">{{label.abbr}}</th></tr></thead><tbody class="datepicker-days"><tr ng-repeat="row in rows"><td ng-repeat="dt in row" ng-class="{'btn-info': dt.selected}"><button type="button" style="width:100%;" ng-click="select(dt.date)" ng-disabled="dt.disabled"><span ng-class="{'text-muted': dt.secondary, 'text-info': dt.current}">{{dt.label}}</span></button></td></tr></tbody><table></div>
    </script>

  <!-- Modal -->
  <script type="text/ng-template" id="template/modal/backdrop.html">
      <div class="overlay"></div>
    </script>
  <script type="text/ng-template" id="template/modal/window.html">
      <div id="modalWrapper" class="modal-wrapper" ng-class="{ 'loading': false }" ng-transclude></div>
    </script>

  <!-- Tooltip -->
  <script type="text/ng-template" id="template/tooltip/tooltip-popup.html">
      <div id="tooltipTest" class="tooltip {{placement}}" ng-class="{ 'in': isOpen(), 'tooltip-alt': animation() }"><div class="tooltip-arrow"></div><div class="tooltip-inner" ng-bind="content"></div></div>
    </script>

  <!-- Bank Suggest -->
  <script type="text/ng-template" id="template/banktypeahead.html">
      <div in-view="mustShow = $inview">
      	<div ng-show="::mustShow">
      		<a class="matching" ng-show="::(match.model.code != null)" tabindex="-1" bind-html-unsafe="::('<div><span> ' + (match.model.code | typeaheadHighlight:query)+' '+(match.label | typeaheadHighlight:query)+'</span></div>')"></a>
      		<a class="matching" ng-hide="::(match.model.code != null)" tabindex="-1" bind-html-unsafe="::('<div><span> ' + (match.label | typeaheadHighlight:query)+ '</span></div>')"></a>
      	</div>
      <div>
    </script>

	<script type='text/ng-template' id='" + path + "'>" + readFileContent(file) + "</script>"
