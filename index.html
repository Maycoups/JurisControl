                                        {jaConfigurada && (
                                            <button

        function DeadlineCalculatorView() {
            const [startDate, setStartDate] = useState(new Date().toISOString().split('T')[0]);
            const [daysCount, setDaysCount] = useState(15);
            const [finalDate, setFinalDate] = useState(null);

            const calculateCPCDeadline = () => {
                let current = new Date(startDate + 'T00:00:00');
                let addedDays = 0;

                // Avança para o próximo dia útil inicial
                current.setDate(current.getDate() + 1);

                while (addedDays < daysCount) {
                    const dayOfWeek = current.getDay();
                    // 0 = Domingo, 6 = Sábado
                    if (dayOfWeek !== 0 && dayOfWeek !== 6) {
                        addedDays++;
                    }
                    if (addedDays < daysCount) {
                        current.setDate(current.getDate() + 1);
                    }
                }

                setFinalDate(current);
            };

            useEffect(() => {
                calculateCPCDeadline();
            }, [startDate, daysCount]);

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h2 className="text-2xl font-bold text-slate-900">Calculadora de Prazos (CPC - Dias Úteis)</h2>
                        <p className="text-slate-500 text-sm mt-1">Simulação de contagem conforme Art. 219 do Código de Processo Civil (exclui finais de semana).</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                            <div>
                                <label className="block text-xs font-semibold text-slate-700 mb-1">Data da Intimação / Publicação</label>
                                <input
                                    type="date"
                                    value={startDate}
                                    onChange={(e) => setStartDate(e.target.value)}
                                    className="w-full p-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                />
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-slate-700 mb-1">Quantidade de Dias (Úteis)</label>
                                <input
                                    type="number"
                                    value={daysCount}
                                    onChange={(e) => setDaysCount(Number(e.target.value))}
                                    className="w-full p-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                />
                            </div>

                            <div className="p-4 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-800">
                                <strong>Nota legal:</strong> A contagem inicia-se no primeiro dia útil subsequente à publicação. Não considera feriados locais customizados.
                            </div>
                        </div>

                        <div className="bg-gradient-to-br from-slate-900 to-slate-800 text-white p-6 rounded-2xl flex flex-col justify-between shadow-md">
                            <div>
                                <span className="text-xs uppercase tracking-widest text-amber-400 font-semibold">Resultado Estimado</span>
                                <h3 className="text-xl font-bold mt-2">Data Fatal do Prazo:</h3>
                                <div className="text-3xl md:text-4xl font-extrabold text-amber-400 mt-4">
                                    {finalDate ? finalDate.toLocaleDateString('pt-BR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) : '---'}
                                </div>
                            </div>
                            <div className="text-xs text-slate-400 border-t border-slate-700 pt-4 mt-6">
                                Sempre confira eventuais portarias de suspensão de expediente do Tribunal competente.
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

                                <label className="block text-xs font-semibold text-slate-600 mb-1">Cliente *</label>
                                <select className="w-full p-2 bg-slate-50 border rounded-lg text-sm" value={form.clienteId} onChange={e => setForm({...form, clienteId: e.target.value})}>
                                    {clients.map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}
                                </select>
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Área do Direito</label>
                                    <select className="w-full p-2 bg-slate-50 border rounded-lg text-sm" value={form.area} onChange={e => setForm({...form, area: e.target.value})}>
                                        <option value="Cível">Cível</option>
                                        <option value="Trabalhista">Trabalhista</option>
                                        <option value="Previdenciário">Previdenciário</option>
                                        <option value="Família">Família</option>
                                        <option value="Consumidor">Consumidor</option>
                                        <option value="Penal">Penal</option>
                                        <option value="Tributário">Tributário</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Valor da Causa (R$)</label>
                                    <input type="number" className="w-full p-2 bg-slate-50 border rounded-lg text-sm" value={form.valorCausa} onChange={e => setForm({...form, valorCausa: Number(e.target.value)})} />
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-600 mb-1">Vara / Tribunal</label>
                                <input placeholder="Ex: 2ª Vara Cível da Comarca de SP" type="text" className="w-full p-2 bg-slate-50 border rounded-lg text-sm" value={form.vara} onChange={e => setForm({...form, vara: e.target.value})} />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-600 mb-1">Ação / Objeto</label>
                                <input placeholder="Ex: Ação de Cobrança" type="text" className="w-full p-2 bg-slate-50 border rounded-lg text-sm" value={form.acao} onChange={e => setForm({...form, acao: e.target.value})} />
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Fase Processual</label>
                                    <input placeholder="Ex: Aguardando Réplica" type="text" className="w-full p-2 bg-slate-50 border rounded-lg text-sm" value={form.fase} onChange={e => setForm({...form, fase: e.target.value})} />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Próximo Prazo (Data)</label>
                                    <input type="date" className="w-full p-2 bg-slate-50 border rounded-lg text-sm" value={form.proximoPrazo} onChange={e => setForm({...form, proximoPrazo: e.target.value})} />
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-600 mb-1">Descrição do Prazo</label>
                                <input placeholder="Ex: Réplica" type="text" className="w-full p-2 bg-slate-50 border rounded-lg text-sm" value={form.descricaoPrazo} onChange={e => setForm({...form, descricaoPrazo: e.target.value})} />
                            </div>
                            <div className="flex justify-end gap-2 pt-3 border-t">
                                <button type="button" onClick={onClose} className="px-4 py-2 bg-slate-100 text-slate-700 text-xs font-semibold rounded-lg">Cancelar</button>
                                <button type="submit" className="px-4 py-2 bg-amber-500 text-slate-950 text-xs font-bold rounded-lg shadow-sm hover:bg-amber-600">{isEditing ? 'Salvar Alterações' : 'Salvar Processo'}</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function FinancialModal({ clients, onClose, onSave }) {
            const [form, setForm] = useState({
                descricao: '', clienteNome: clients[0]?.nome || '', tipo: 'receita', categoria: 'Honorários Contratuais', valor: 1000, vencimento: new Date().toISOString().split('T')[0], status: 'Pendente'
            });

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave(form);
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                        <div className="flex justify-between items-center border-b pb-3">
                            <h3 className="font-bold text-lg text-slate-900">Novo Lançamento Financeiro</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><i className="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-3">
                            <div>
                                <label className="block text-xs font-semibold text-slate-600 mb-1">Descrição do Lançamento *</label>
                                <input required type="text" className="w-full p-2 bg-slate-50 border rounded-lg text-sm" value={form.descricao} onChange={e => setForm({...form, descricao: e.target.value})} />
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Tipo</label>
                                    <select className="w-full p-2 bg-slate-50 border rounded-lg text-sm" value={form.tipo} onChange={e => setForm({...form, tipo: e.target.value})}>
                                        <option value="receita">Receita (Honorários)</option>
                                        <option value="despesa">Despesa Processual</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Valor (R$) *</label>
                                    <input required type="number" className="w-full p-2 bg-slate-50 border rounded-lg text-sm" value={form.valor} onChange={e => setForm({...form, valor: Number(e.target.value)})} />
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-600 mb-1">Cliente Associado</label>
                                <select className="w-full p-2 bg-slate-50 border rounded-lg text-sm" value={form.clienteNome} onChange={e => setForm({...form, clienteNome: e.target.value})}>
                                    {clients.map(c => <option key={c.id} value={c.nome}>{c.nome}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-600 mb-1">Data de Vencimento</label>
                                <input type="date" className="w-full p-2 bg-slate-50 border rounded-lg text-sm" value={form.vencimento} onChange={e => setForm({...form, vencimento: e.target.value})} />
                            </div>
                            <div className="flex justify-end gap-2 pt-3 border-t">
                                <button type="button" onClick={onClose} className="px-4 py-2 bg-slate-100 text-slate-700 text-xs font-semibold rounded-lg">Cancelar</button>
                                <button type="submit" className="px-4 py-2 bg-amber-500 text-slate-950 text-xs font-bold rounded-lg shadow-sm hover:bg-amber-600">Registrar</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // Painel de IA embutido nos detalhes do processo (resumo / próximo passo / minuta
        // rápida) — reaproveita a mesma Edge Function "criar-peca-ia" da aba Criação de
        // Peças (IA), agora com contrato unificado { tarefa, contexto, apiKey }.
        function AiAssistPanel({ process, supabaseClient }) {
            const [tipoPeca, setTipoPeca] = useState(TIPOS_PECA_IA[0]);
            const [instrucoes, setInstrucoes] = useState('');
            const [resultado, setResultado] = useState('');
            const [erro, setErro] = useState('');
            const [carregando, setCarregando] = useState(''); // '' | 'minuta' | 'resumo' | 'proximo_passo'
            const [copiado, setCopiado] = useState(false);

            const executar = async (tarefa, extra) => {
                if (!supabaseClient) { setErro('Cliente Supabase não inicializado.'); return; }
                setCarregando(tarefa);
                setErro('');
                setCopiado(false);
                try {
                    const { apiKey, provedor } = await resolverProvedorIA();
                    const { data, error } = await invocarFunction(supabaseClient, 'criar-peca-ia', {
                        body: { tarefa, contexto: { processo: process, ...extra }, apiKey: apiKey || undefined, provedor: provedor || undefined },
                    });
                    if (error) throw error;
                    if (data && data.error) { setErro(data.error); return; }
                    setResultado((data && data.texto) || '');
                } catch (e) {
                    setErro(e.message || 'Falha ao chamar o assistente de IA.');
                } finally {
                    setCarregando('');
                }
            };

            const handleCopiar = () => {
                navigator.clipboard.writeText(resultado).then(() => {
                    setCopiado(true);
                    setTimeout(() => setCopiado(false), 2000);
                });
            };

            return (
                <div className="border-t pt-4 space-y-3">
                    <h4 className="text-xs font-bold text-slate-700 uppercase flex items-center gap-2">
                        <i className="fa-solid fa-wand-magic-sparkles text-indigo-500"></i> Assistente de IA
                    </h4>

                    <div className="space-y-2">
                        <div className="flex flex-col sm:flex-row gap-2">
                            <select
                                className="flex-1 p-2 bg-slate-50 border rounded-lg text-xs"
                                value={tipoPeca}
                                onChange={e => setTipoPeca(e.target.value)}
                            >
                                {TIPOS_PECA_IA.map(t => <option key={t} value={t}>{t}</option>)}
                            </select>
                            <button
                                onClick={() => executar('minuta', { tipoPeca, instrucoes })}
                                disabled={!!carregando}
                                className="px-3 py-2 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-60 text-white text-xs font-bold rounded-lg shadow-sm whitespace-nowrap"
                            >
                                {carregando === 'minuta' ? 'Gerando...' : 'Gerar Minuta'}
                            </button>
                        </div>
                        <textarea
                            placeholder="Instruções adicionais para a minuta (opcional)"
                            className="w-full p-2 bg-slate-50 border rounded-lg text-xs"
                            rows="2"
                            value={instrucoes}
                            onChange={e => setInstrucoes(e.target.value)}
                        />
                        <div className="flex flex-wrap gap-2">
                            <button
                                onClick={() => executar('resumo', {})}
                                disabled={!!carregando}
                                className="px-3 py-2 bg-slate-700 hover:bg-slate-800 disabled:opacity-60 text-white text-xs font-bold rounded-lg shadow-sm"
                            >
                                {carregando === 'resumo' ? 'Resumindo...' : 'Resumir Processo'}
                            </button>
                            <button
                                onClick={() => executar('proximo_passo', {})}
                                disabled={!!carregando}
                                className="px-3 py-2 bg-slate-700 hover:bg-slate-800 disabled:opacity-60 text-white text-xs font-bold rounded-lg shadow-sm"
                            >
                                {carregando === 'proximo_passo' ? 'Analisando...' : 'Sugerir Próximo Passo'}
                            </button>
                        </div>
                    </div>

                    {erro && <p className="text-xs text-red-600 bg-red-50 border border-red-200 rounded-lg p-2">{erro}</p>}

                    {resultado && (
                        <div className="space-y-1">
                            <textarea readOnly className="w-full p-2 bg-slate-50 border rounded-lg text-xs font-mono" rows="8" value={resultado} />
                            <div className="flex gap-3">
                                <button onClick={handleCopiar} className="text-xs font-semibold text-indigo-600 hover:text-indigo-800">
                                    <i className="fa-solid fa-copy"></i> {copiado ? 'Copiado!' : 'Copiar texto'}
                                </button>
                                <button onClick={() => baixarComoWord(resultado, `ia-${process.numero}`)} className="text-xs font-semibold text-blue-700 hover:text-blue-900">
                                    <i className="fa-solid fa-file-word"></i> Baixar em Word
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Integração DataJud/CNJ — busca movimentações oficiais pelo número do processo.
        // As movimentações retornadas são só SUGESTÃO: nunca sobrescrevem fase/próximo
        // prazo automaticamente — o advogado decide o que copiar, via o botão "Editar".
        function DataJudPanel({ process, supabaseClient }) {
            const [carregando, setCarregando] = useState(false);
            const [erro, setErro] = useState('');
            const [movimentacoes, setMovimentacoes] = useState(null);
            const [mensagem, setMensagem] = useState('');
            const [copiadoIdx, setCopiadoIdx] = useState(null);

            const buscar = async () => {
                if (!supabaseClient) { setErro('Cliente Supabase não inicializado.'); return; }
                setCarregando(true);
                setErro('');
                try {
                    const apiKey = await getSecret('DATAJUD_API_KEY');
                    const { data, error } = await invocarFunction(supabaseClient, 'datajud-busca', {
                        body: { numeroCNJ: process.numero, apiKey: apiKey || undefined },
                    });
                    if (error) throw error;
                    if (data && data.error) { setErro(data.error); setMovimentacoes(null); return; }
                    setMovimentacoes(data.movimentacoes || []);
                    setMensagem(data.mensagem || '');
                } catch (e) {
                    setErro(e.message || 'Falha ao consultar o DataJud.');
                    setMovimentacoes(null);
                } finally {
                    setCarregando(false);
                }
            };

            const copiarMovimentacao = (mov, idx) => {
                navigator.clipboard.writeText(mov.nome || '').then(() => {
                    setCopiadoIdx(idx);
                    setTimeout(() => setCopiadoIdx(null), 2000);
                });
            };

            return (
                <div className="border-t pt-4 space-y-3">
                    <div className="flex items-center justify-between">
                        <h4 className="text-xs font-bold text-slate-700 uppercase flex items-center gap-2">
                            <i className="fa-solid fa-landmark-flag text-amber-500"></i> Movimentações (DataJud/CNJ)
                        </h4>
                        <button
                            onClick={buscar}
                            disabled={carregando}
                            className="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 disabled:opacity-60 text-slate-950 text-xs font-bold rounded-lg shadow-sm"
                        >
                            {carregando ? 'Buscando...' : 'Atualizar do DataJud'}
                        </button>
                    </div>

                    {erro && <p className="text-xs text-red-600 bg-red-50 border border-red-200 rounded-lg p-2">{erro}</p>}

                    {movimentacoes !== null && (
                        <div className="space-y-2">
                            {mensagem && <p className="text-xs text-slate-500">{mensagem}</p>}
                            {movimentacoes.length > 0 && (
                                <ul className="space-y-1.5 max-h-56 overflow-y-auto pr-1">
                                    {movimentacoes.map((mov, idx) => (
                                        <li key={idx} className="flex items-start justify-between gap-2 p-2 bg-slate-50 border rounded-lg text-xs">
                                            <div>
                                                <span className="block text-slate-400">
                                                    {mov.data ? new Date(mov.data).toLocaleDateString('pt-BR') : 'Data não informada'}
                                                </span>
                                                <span className="text-slate-700">{mov.nome}</span>
                                            </div>
                                            <button
                                                onClick={() => copiarMovimentacao(mov, idx)}
                                                className="shrink-0 text-indigo-600 hover:text-indigo-800 font-semibold whitespace-nowrap"
                                                title="Copiar texto (cole em Fase ou Descrição do Prazo ao Editar o processo)"
                                            >
                                                <i className="fa-solid fa-copy"></i> {copiadoIdx === idx ? 'Copiado!' : 'Copiar'}
                                            </button>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        function ProcessDetailsModal({ process, clients, session, onClose, onEdit, supabaseClient }) {
            const [jurisprudencia, setJurisprudencia] = useState(null); // null = ainda não buscou
            const [loadingJuris, setLoadingJuris] = useState(false);
            const [erroJuris, setErroJuris] = useState(null);

            useEffect(() => {
                let cancelado = false;
                // process.acao pode vir muito longo em processos importados do DJEN
                // (texto bruto da publicação) — um termo de busca curto funciona melhor.
                const acaoCurta = (process.acao || '').split(/\s+/).slice(0, 8).join(' ');
                const termo = (acaoCurta || process.area || '').trim();
                if (!termo || !supabaseClient) return;

                setLoadingJuris(true);
                setErroJuris(null);

                invocarFunction(supabaseClient, 'busca-jurisprudencia', { body: { termo, uf: process.uf || 'RJ' } })
                    .then(({ data, error }) => {
                        if (cancelado) return;
                        if (error) throw error;
                        setJurisprudencia(data);
                    })
                    .catch(err => {
                        if (cancelado) return;
                        console.error('Erro ao buscar jurisprudência:', err);
                        setErroJuris('Não foi possível buscar jurisprudência relacionada agora.');
                    })
                    .finally(() => { if (!cancelado) setLoadingJuris(false); });

                return () => { cancelado = true; };
            }, [process.id]);

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl space-y-4 max-h-[85vh] overflow-y-auto">
                        <div className="flex justify-between items-center border-b pb-3">
                            <div>
                                <span className="text-xs font-bold text-amber-600 uppercase">{process.area}</span>
                                <h3 className="font-bold text-lg text-slate-900">{process.numero}</h3>
                            </div>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><i className="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <div className="space-y-3 text-sm text-slate-700">
                            <p><strong>Cliente:</strong> {process.clienteNome}</p>
                            <p><strong>Vara/Tribunal:</strong> {process.vara}</p>
                            <p><strong>Ação:</strong> {process.acao}</p>
                            <p><strong>Fase Atual:</strong> <span className="px-2 py-0.5 bg-blue-50 text-blue-700 font-semibold rounded text-xs">{process.fase}</span></p>
                            <p><strong>Valor da Causa:</strong> R$ {Number(process.valorCausa).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</p>
                            {process.proximoPrazo && (
                                <div className="p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-900">
                                    <strong>Próximo Prazo:</strong> {process.descricaoPrazo} (Vencimento: {new Date(process.proximoPrazo + 'T00:00:00').toLocaleDateString('pt-BR')})
                                </div>
                            )}
                        </div>

                        <div className="pt-3 border-t">
                            <div className="flex items-center justify-between mb-3">
                                <h4 className="font-bold text-slate-900 text-sm flex items-center gap-2">
                                    <i className="fa-solid fa-scale-balanced text-indigo-500"></i> Jurisprudência Relacionada
                                </h4>
                                {jurisprudencia && (
                                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded uppercase ${jurisprudencia.simulado ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'}`}>
                                        {jurisprudencia.simulado ? 'Simulação' : `Real (${jurisprudencia.fonte})`}
                                    </span>
                                )}
                            </div>

                            {loadingJuris && (
                                <p className="text-xs text-slate-400"><i className="fa-solid fa-spinner fa-spin mr-2"></i>Buscando jurisprudência relacionada...</p>
                            )}
                            {erroJuris && <p className="text-xs text-rose-600">{erroJuris}</p>}
                            {jurisprudencia && jurisprudencia.mensagem && (
                                <p className="text-[11px] text-slate-400 mb-2">{jurisprudencia.mensagem}</p>
                            )}
                            {jurisprudencia && (!jurisprudencia.resultados || jurisprudencia.resultados.length === 0) && !loadingJuris && (
                                <p className="text-xs text-slate-400">Nenhum resultado encontrado para este assunto.</p>
                            )}

                            <div className="space-y-3">
                                {(jurisprudencia?.resultados || []).map((r, idx) => (
                                    <div key={idx} className="p-3 bg-slate-50 border border-slate-200 rounded-xl">
                                        <p className="text-xs font-bold text-slate-800">{r.titulo}</p>
                                        <p className="text-[11px] text-indigo-600 font-medium mt-0.5">{r.tribunal} {r.data && `• ${r.data.slice(0, 10)}`}</p>
                                        <p className="text-xs text-slate-600 mt-1.5">{r.ementa}</p>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <AiAssistPanel process={process} supabaseClient={supabaseClient} />
                        <DataJudPanel process={process} supabaseClient={supabaseClient} />

                        <div className="border-t pt-4 space-y-3">
                            <h4 className="text-xs font-bold text-slate-700 uppercase flex items-center gap-2">
                                <i className="fa-solid fa-file-signature text-blue-700"></i> Gerar Documento deste Processo
                            </h4>
                            <DocumentGeneratorView clients={clients} processes={[]} session={session} processoFixo={process} />
                        </div>

                        <div className="flex justify-end gap-2 pt-3 border-t">
                            <button onClick={onClose} className="px-4 py-2 bg-slate-100 text-slate-700 text-xs font-semibold rounded-lg">Fechar</button>
                            <button onClick={() => onEdit(process)} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-lg shadow-sm flex items-center gap-2">
                                <i className="fa-solid fa-pen"></i> Editar
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
