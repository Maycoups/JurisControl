<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JurisControl - Gestão para Advogados Independentes</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Standalone CDN -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Supabase JS (autenticação, dados na nuvem, integração TJRJ, jurisprudência, IA, DataJud) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- html-docx-js (gratuita, MIT) — converte HTML em .docx real, 100% no navegador -->

<body class="bg-slate-50 text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Configuração Supabase (integração TJRJ, jurisprudência, IA, DataJud) ---
        // Chave anon/publishable: é segura para uso no client, mas garanta que
        // as políticas de RLS da tabela/Edge Function no Supabase estejam corretas.
        // Observação: em versões anteriores esta inicialização falhava porque a
        // variável local se chamava "supabase", sombreando o objeto global "window.supabase"
        // antes de chamar .createClient() nele. Por isso usamos window.supabase explicitamente.
        const SUPABASE_URL = 'https://yenznpfqqocdkzlcfhdv.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_glTe9_IZ-TxaddwodCc5ZA__wbgYsUh';
        let supabaseClient = null;
        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {
            console.error('Erro ao iniciar o cliente Supabase (integrações ficarão indisponíveis):', e);
        }

        // --- Credenciais locais (chaves de IA "traga a sua", DataJud) ---
        // No app instalado (Electron), ficam criptografadas via safeStorage, fora
        // da pasta do projeto (ver preload.js / main.js) — nunca em texto puro,
        // nunca no código-fonte. Na versão web não existe esse armazenamento
        // criptografado do sistema operacional, então caímos para o
        // localStorage do próprio navegador (funciona, mas não é criptografado —
        // por isso a interface avisa quando está nesse modo). Em qualquer um dos
        // dois casos, a chave só sai do dispositivo na hora de usar (uma
        // chamada) e nunca fica salva no nosso servidor.
        const PREFIXO_SECRET_LOCAL = 'jc_secret_';

        async function armazenamentoSeguroDisponivel() {
            if (!window.jcSecrets) return false;
            try { return await window.jcSecrets.disponivel(); } catch { return false; }
        }

        async function getSecret(nome) {
            if (window.jcSecrets) {
                try {
                    const valor = await window.jcSecrets.get(nome);
                    if (valor) return valor;
                } catch { /* cai pro fallback abaixo */ }
            }
            try {
                return localStorage.getItem(PREFIXO_SECRET_LOCAL + nome) || null;
            } catch {
                return null;
            }
        }

        async function setSecret(nome, valor) {
            if (window.jcSecrets) {
                try {
                    const resultado = await window.jcSecrets.set(nome, valor);
                    if (resultado && resultado.ok) return { ok: true, seguro: true };
                } catch { /* cai pro fallback abaixo */ }
            }
            try {
                localStorage.setItem(PREFIXO_SECRET_LOCAL + nome, valor);
                return { ok: true, seguro: false };
            } catch (e) {
                return { ok: false, erro: e.message };
            }
        }

        async function deleteSecret(nome) {
            if (window.jcSecrets) {
                try { await window.jcSecrets.delete(nome); } catch { /* ignora */ }
            }
            try { localStorage.removeItem(PREFIXO_SECRET_LOCAL + nome); } catch { /* ignora */ }
        }

        const CNJ_REGEX = /^\d{7}-\d{2}\.\d{4}\.\d{1}\.\d{2}\.\d{4}$/;

        // supabaseClient.functions.invoke() sempre devolve error.message genérico
        // ("Edge Function returned a non-2xx status code"), mesmo quando a function
        // manda uma mensagem específica e útil no corpo da resposta (ex: "IA
        // gratuita indisponível...", "Não autenticado..."). A mensagem de verdade
        // fica em error.context (a Response crua), que a biblioteca não lê sozinha
        // — confirmado testando ao vivo. Este helper tem a mesma assinatura de
        // functions.invoke(), só que com error.message já sendo o texto real
        // quando a function devolveu um `{ error: "..." }` no corpo.
        async function invocarFunction(supabaseClient, nome, opcoes) {
            const resultado = await supabaseClient.functions.invoke(nome, opcoes);
            if (resultado.error && resultado.error.context) {
                try {
                    const corpo = await resultado.error.context.json();
                    if (corpo && corpo.error) {
                        resultado.error = new Error(corpo.error);
                        resultado.error.detalhes = corpo;
                    }
                } catch { /* corpo não era JSON — mantém a mensagem genérica original */ }
            }
            return resultado;
        }

        // --- Exportar texto como .docx real (Word) ---
        // html-docx-js roda 100% no navegador (gratuita, MIT) e converte um HTML
        // completo num Blob .docx que o Word abre nativamente, sem servidor nenhum.
        function baixarComoWord(texto, nomeArquivo) {
            if (!window.htmlDocx) {
                alert('Exportação para Word indisponível no momento (biblioteca não carregou). Tente copiar o texto manualmente.');
                return;
            }
            const linhasHtml = String(texto)
                .split('\n')
                .map(linha => `<p>${linha.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') || '&nbsp;'}</p>`)
                .join('\n');
            const htmlCompleto = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>
                body { font-family: 'Times New Roman', serif; font-size: 12pt; line-height: 1.5; }
                p { margin: 0 0 8pt 0; }
            </style></head><body>${linhasHtml}</body></html>`;
            const blob = window.htmlDocx.asBlob(htmlCompleto);
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = nomeArquivo.endsWith('.docx') ? nomeArquivo : `${nomeArquivo}.docx`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 5000);
        }

        // --- Urgência de prazo (usada no Kanban) ---
        // Retorna null se não há prazo, ou { dias, nivel, label } onde nivel é
        // 'vencido' | 'urgente' (até 3 dias) | 'atencao' (até 7 dias) | 'ok'.
        function calcularUrgenciaPrazo(dataISO) {
            if (!dataISO) return null;
            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0);
            const prazo = new Date(dataISO + 'T00:00:00');
            const dias = Math.round((prazo - hoje) / 86400000);
            let nivel = 'ok';
            if (dias < 0) nivel = 'vencido';
            else if (dias <= 3) nivel = 'urgente';
            else if (dias <= 7) nivel = 'atencao';
            const label = dias < 0 ? `Vencido há ${Math.abs(dias)}d` : dias === 0 ? 'Vence hoje' : `${dias}d restantes`;
            return { dias, nivel, label };
        }

        // Componente de topo: só decide o que mostrar com base na sessão de
        // autenticação (Supabase Auth). Sem sessão -> tela de login. Com sessão ->
        // o app completo (AppLogado), já amarrado ao usuário logado.
        function App() {
            const [session, setSession] = useState(undefined); // undefined = verificando | null = deslogado | objeto = logado

            useEffect(() => {
                if (!supabaseClient) { setSession(null); return; }
                supabaseClient.auth.getSession().then(({ data }) => setSession(data.session));
                const { data: assinatura } = supabaseClient.auth.onAuthStateChange((_evento, novaSessao) => {
                    setSession(novaSessao);
                });
                return () => assinatura.subscription.unsubscribe();
            }, []);

            if (!supabaseClient) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-100 p-6">
                        <div className="max-w-md text-center space-y-3 bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
                            <i className="fa-solid fa-triangle-exclamation text-3xl text-rose-500"></i>
                            <h2 className="font-bold text-slate-900">Não foi possível iniciar o sistema</h2>
                            <p className="text-sm text-slate-500">Falha ao conectar com o Supabase. Recarregue a página; se o problema continuar, entre em contato com o administrador.</p>
                        </div>
                    </div>
                );
            }

            if (session === undefined) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-100">
                        <i className="fa-solid fa-scale-balanced text-4xl text-amber-500 animate-pulse"></i>
                    </div>
                );
            }

            if (!session) {
                return <LoginView supabaseClient={supabaseClient} />;
            }

            return <AppLogado session={session} supabaseClient={supabaseClient} />;
        }

        function LoginView({ supabaseClient }) {
            const [modo, setModo] = useState('entrar'); // 'entrar' | 'criar' | 'recuperar'
            const [email, setEmail] = useState('');
            const [senha, setSenha] = useState('');
            const [carregando, setCarregando] = useState(false);
            const [mensagem, setMensagem] = useState(null); // { tipo: 'erro'|'sucesso', texto }

            const handleSubmit = async (e) => {
                e.preventDefault();
                setMensagem(null);
                setCarregando(true);
                try {
                    if (modo === 'entrar') {
                        const { error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
                        if (error) throw error;
                    } else if (modo === 'criar') {
                        if (senha.length < 6) {
                            setMensagem({ tipo: 'erro', texto: 'A senha precisa ter pelo menos 6 caracteres.' });
                            setCarregando(false);
                            return;
                        }
                        // Verifica o convite ANTES de tentar criar a conta — evita depender da
                        // mensagem de erro do signUp() em caso de recusa (o cliente Supabase
                        // trata a recusa como erro "retentável" e troca a mensagem original por
                        // um texto genérico depois de tentar de novo sozinho).
                        const { data: convite, error: erroConvite } = await invocarFunction(supabaseClient, 'verificar-convite', { body: { email } });
                        if (erroConvite) {
                            setMensagem({ tipo: 'erro', texto: 'Não foi possível verificar o convite agora. Tente novamente em instantes.' });
                            setCarregando(false);
                            return;
                        }
                        if (!convite || !convite.permitido) {
                            setMensagem({ tipo: 'erro', texto: 'Este e-mail não está na lista de convidados do JurisControl. Peça acesso ao administrador.' });
                            setCarregando(false);
                            return;
                        }
                        const { data, error } = await supabaseClient.auth.signUp({ email, password: senha });
                        if (error) throw error;
                        if (data.session) {
                            // Projeto sem confirmação de e-mail obrigatória: já entra direto.
                        } else {
                            setMensagem({ tipo: 'sucesso', texto: 'Conta criada! Verifique seu e-mail para confirmar o cadastro antes de entrar.' });
                            setModo('entrar');
                        }
                    } else if (modo === 'recuperar') {
                        const { error } = await supabaseClient.auth.resetPasswordForEmail(email);
                        if (error) throw error;
                        setMensagem({ tipo: 'sucesso', texto: 'Se este e-mail estiver cadastrado, enviamos um link para redefinir a senha.' });
                        setModo('entrar');
                    }
                } catch (err) {
                    setMensagem({ tipo: 'erro', texto: err.message || 'Algo deu errado. Tente novamente.' });
                } finally {
                    setCarregando(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-950 p-4">
                    <div className="w-full max-w-sm">
                        <div className="flex flex-col items-center mb-8">
                            <div className="bg-gradient-to-tr from-amber-500 to-amber-300 text-slate-950 p-3.5 rounded-2xl shadow-lg mb-4">
                                <i className="fa-solid fa-scale-balanced text-3xl"></i>
                            </div>
                            <h1 className="font-bold text-white text-2xl tracking-tight">JurisControl</h1>
                            <p className="text-slate-400 text-sm">Gestão para Advogados Independentes</p>
                        </div>

                        <div className="bg-white rounded-2xl shadow-2xl p-6 space-y-4">
                            {modo !== 'recuperar' && (
                                <div className="flex bg-slate-100 rounded-xl p-1">
                                    <button
                                        type="button"
                                        onClick={() => { setModo('entrar'); setMensagem(null); }}
                                        className={`flex-1 py-2 rounded-lg text-sm font-semibold transition ${modo === 'entrar' ? 'bg-white shadow-sm text-slate-900' : 'text-slate-500'}`}
                                    >
                                        Entrar
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => { setModo('criar'); setMensagem(null); }}
                                        className={`flex-1 py-2 rounded-lg text-sm font-semibold transition ${modo === 'criar' ? 'bg-white shadow-sm text-slate-900' : 'text-slate-500'}`}
                                    >
                                        Criar conta
                                    </button>
                                </div>
                            )}
                            {modo === 'recuperar' && (
                                <h2 className="font-bold text-slate-900 text-center">Recuperar senha</h2>
                            )}

                            {mensagem && (
                                <div className={`p-3 rounded-xl text-xs font-medium ${mensagem.tipo === 'erro' ? 'bg-rose-50 text-rose-700 border border-rose-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`}>
                                    {mensagem.texto}
                                </div>
                            )}

                            <form onSubmit={handleSubmit} className="space-y-3">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">E-mail</label>
                                    <input
                                        required
                                        type="email"
                                        value={email}
                                        onChange={e => setEmail(e.target.value)}
                                        className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                        placeholder="seuemail@exemplo.com"
                                    />
                                </div>
                                {modo !== 'recuperar' && (
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Senha</label>
                                        <input
                                            required
                                            type="password"
                                            value={senha}
                                            onChange={e => setSenha(e.target.value)}
                                            minLength={6}
                                            className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                            placeholder="••••••••"
                                        />
                                    </div>
                                )}

                                <button
                                    type="submit"
                                    disabled={carregando}
                                    className="w-full py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl text-sm shadow-sm transition disabled:opacity-60"
                                >
                                    {carregando
                                        ? <i className="fa-solid fa-spinner fa-spin"></i>
                                        : modo === 'entrar' ? 'Entrar' : modo === 'criar' ? 'Criar conta' : 'Enviar link de recuperação'}
                                </button>
                            </form>

                            {modo === 'entrar' && (
                                <button onClick={() => { setModo('recuperar'); setMensagem(null); }} className="w-full text-center text-xs text-slate-400 hover:text-slate-600">
                                    Esqueci minha senha
                                </button>
                            )}
                            {modo === 'recuperar' && (
                                <button onClick={() => { setModo('entrar'); setMensagem(null); }} className="w-full text-center text-xs text-slate-400 hover:text-slate-600">
                                    <i className="fa-solid fa-arrow-left mr-1"></i> Voltar para o login
                                </button>
                            )}
                        </div>
                        <p className="text-center text-slate-500 text-xs mt-6">Acesso restrito. Seus dados ficam protegidos e visíveis só para você.</p>
                    </div>
                </div>
            );
        }

        function AppLogado({ session, supabaseClient }) {
            const userId = session.user.id;

            // Persistent States — clientes/processos/financeiro moram no Supabase,
            // protegidos por RLS (só o próprio usuário enxerga suas linhas). Alertas
            // e OABs monitoradas ainda ficam no localStorage (ver Index.html — nota
            // no plano de V1: são mais "cache do feed do DJEN" que dado de negócio).
            const [activeTab, setActiveTab] = useState('dashboard');
            const [clients, setClients] = useState([]);
            const [processes, setProcesses] = useState([]);
            const [financials, setFinancials] = useState([]);
            const [dadosCarregados, setDadosCarregados] = useState(false);
            const [erroCarregamento, setErroCarregamento] = useState(null);
            const [alertas, setAlertas] = useState(() => {
                const local = localStorage.getItem('jc_alertas');
                return local ? JSON.parse(local) : [];
            });
            const [oabsMonitoradas, setOabsMonitoradas] = useState(() => {
                const local = localStorage.getItem('jc_oabs');
                return local ? JSON.parse(local) : [];
            });

            // UI States
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [toastMessage, setToastMessage] = useState('');

            // Modals
            const [showClientModal, setShowClientModal] = useState(false);
            const [processModal, setProcessModal] = useState(null); // null=fechado | 'new' | objeto do processo (edição)
            const [showFinancialModal, setShowFinancialModal] = useState(false);
            const [selectedProcess, setSelectedProcess] = useState(null);

            // Carrega clientes/processos/financeiro do Supabase ao logar (ou trocar de conta)
            useEffect(() => {
                let cancelado = false;
                async function carregarDados() {
                    setDadosCarregados(false);
                    setErroCarregamento(null);
                    const [clientesRes, processosRes, financeiroRes] = await Promise.all([
                        supabaseClient.from('clients').select('data').eq('user_id', userId),
                        supabaseClient.from('processes').select('data').eq('user_id', userId),
                        supabaseClient.from('financials').select('data').eq('user_id', userId),
                    ]);
                    if (cancelado) return;
                    const erro = clientesRes.error || processosRes.error || financeiroRes.error;
                    if (erro) {
                        console.error('Erro ao carregar dados do Supabase:', erro);
                        setErroCarregamento(erro.message || 'Falha ao carregar seus dados.');
                    }
                    setClients((clientesRes.data || []).map(r => r.data));
                    setProcesses((processosRes.data || []).map(r => r.data));
                    setFinancials((financeiroRes.data || []).map(r => r.data));
                    setDadosCarregados(true);
                }
                carregarDados();
                return () => { cancelado = true; };
            }, [userId]);

            useEffect(() => {
                localStorage.setItem('jc_alertas', JSON.stringify(alertas));
            }, [alertas]);

            useEffect(() => {
                localStorage.setItem('jc_oabs', JSON.stringify(oabsMonitoradas));
            }, [oabsMonitoradas]);

            const showNotification = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3500);
            };

            // Grava um registro (cliente/processo/financeiro) no Supabase. Atualização
            // otimista: o estado local já mudou antes desta função ser chamada — se a
            // gravação falhar (sem internet, etc.), só avisamos por toast, sem travar a tela.
            const salvarNoSupabase = async (tabela, objeto) => {
                const { error } = await supabaseClient
                    .from(tabela)
                    .upsert({ id: objeto.id, user_id: userId, data: objeto, updated_at: new Date().toISOString() });
                if (error) {
                    console.error(`Erro ao sincronizar com ${tabela}:`, error);
                    showNotification(`Aviso: alteração não sincronizada com a nuvem (${error.message}).`);
                }
            };

            // Form Handlers
            const handleAddClient = (newClient) => {
                const clientObj = { ...newClient, id: 'cli-' + Date.now(), dataCadastro: new Date().toISOString().split('T')[0] };
                setClients([clientObj, ...clients]);
                setShowClientModal(false);
                showNotification('Cliente cadastrado com sucesso!');
                salvarNoSupabase('clients', clientObj);
            };

            const handleAddProcess = (newProcess) => {
                const procObj = { ...newProcess, id: 'proc-' + Date.now(), dataCadastro: new Date().toISOString().split('T')[0] };
                setProcesses([procObj, ...processes]);
                setProcessModal(null);
                showNotification('Processo cadastrado com sucesso!');
                salvarNoSupabase('processes', procObj);
            };

            const handleUpdateProcess = (id, patch) => {
                const novoObjeto = { ...(processes.find(p => p.id === id) || {}), ...patch, id };
                setProcesses(processes.map(p => (p.id === id ? novoObjeto : p)));
                setProcessModal(null);
                showNotification('Processo atualizado com sucesso!');
                salvarNoSupabase('processes', novoObjeto);
            };

            const handleAddFinancial = (newItem) => {
                const finObj = { ...newItem, id: 'fin-' + Date.now() };
                setFinancials([finObj, ...financials]);
                setShowFinancialModal(false);
                showNotification('Lançamento financeiro registrado!');
                salvarNoSupabase('financials', finObj);
            };

            const handleImportProcesses = (novosProcessos) => {
                const numerosExistentes = new Set(processes.map(p => p.numero));
                const processosNovos = novosProcessos.filter(p => !numerosExistentes.has(p.numero));
                const duplicados = novosProcessos.length - processosNovos.length;

                if (processosNovos.length === 0) {
                    showNotification('Nenhum processo novo: todos já estavam cadastrados.');
                    return;
                }

                setProcesses([...processosNovos, ...processes]);
                setActiveTab('processos');
                showNotification(
                    `${processosNovos.length} processo(s) importado(s) do TJRJ` +
                    (duplicados > 0 ? ` (${duplicados} já existia(m) e foi(ram) ignorado(s))` : '') + '.'
                );
                processosNovos.forEach(p => salvarNoSupabase('processes', p));
            };

            const handleAddOab = (oab, uf, label) => {
                const oabLimpa = oab.replace(/\D/g, '');
                if (!oabLimpa) return;
                if (oabsMonitoradas.some(o => o.oab === oabLimpa && o.uf === uf)) {
                    showNotification('Esta OAB já está sendo monitorada.');
                    return;
                }
                setOabsMonitoradas([...oabsMonitoradas, { id: 'oab-' + Date.now(), oab: oabLimpa, uf, label: label || `OAB ${oabLimpa}/${uf}` }]);
            };

            const handleRemoveOab = (id) => {
                setOabsMonitoradas(oabsMonitoradas.filter(o => o.id !== id));
            };

            const handleMergeAlertas = (novos) => {
                setAlertas(prev => {
                    const existentesPorId = new Map(prev.map(a => [a.id, a]));
                    for (const novo of novos) {
                        const existente = existentesPorId.get(novo.id);
                        // Preserva o status (tratada/descartada) se o alerta já era conhecido.
                        existentesPorId.set(novo.id, existente ? { ...novo, status: existente.status, processoVinculadoId: existente.processoVinculadoId } : novo);
                    }
                    return [...existentesPorId.values()].sort((a, b) => (b.data || '').localeCompare(a.data || ''));
                });
            };

            const handleAtualizarStatusAlerta = (id, status) => {
                setAlertas(alertas.map(a => a.id === id ? { ...a, status } : a));
            };

            const handleImportarAlertaComoProcesso = (alerta) => {
                const processo = {
                    id: (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : ('proc-' + Date.now() + '-' + Math.random().toString(36).slice(2)),
                    numero: alerta.numero,
                    clienteId: null,
                    clienteNome: alerta.poloAtivo || 'Parte não identificada',
                    area: 'Cível',
                    vara: alerta.orgaoJulgador || '',
                    acao: alerta.tipo ? `${alerta.tipo} - ${alerta.texto || ''}`.slice(0, 180) : (alerta.texto || 'Consulta TJRJ'),
                    status: 'Ativo',
                    fase: 'Publicado no DJEN',
                    valorCausa: 0,
                    honorariosContratados: 0,
                    proximoPrazo: null,
                    descricaoPrazo: '',
                    dataCadastro: new Date().toISOString().split('T')[0],
                    origem: 'tjrj',
                    kanbanStatus: 'A Fazer',
                };
                handleImportProcesses([processo]);
                setAlertas(prev => prev.map(a => a.id === alerta.id ? { ...a, status: 'tratada', processoVinculadoId: processo.id } : a));
            };

            const handleUpdateProcessKanbanStatus = (processoId, novoStatus) => {
                const alvo = processes.find(p => p.id === processoId);
                if (!alvo) return;
                const novoObjeto = { ...alvo, kanbanStatus: novoStatus };
                setProcesses(processes.map(p => p.id === processoId ? novoObjeto : p));
                salvarNoSupabase('processes', novoObjeto);
            };

            const handleTogglePaymentStatus = (id) => {
                let itemAtualizado = null;
                setFinancials(financials.map(item => {
                    if (item.id === id) {
                        const isPago = item.status === 'Pago';
                        itemAtualizado = {
                            ...item,
                            status: isPago ? 'Pendente' : 'Pago',
                            dataPagamento: isPago ? null : new Date().toISOString().split('T')[0]
                        };
                        return itemAtualizado;
                    }
                    return item;
                }));
                showNotification('Status financeiro atualizado!');

            if (!dadosCarregados) {

                    </aside>

                        {activeTab === 'indicadores' && (
                            <IndicadoresView processes={processes} clients={clients} financials={financials} />
                        )}

                        {activeTab === 'clientes' && (
                            <ClientsView
                                clients={clients}
                                processes={processes}
                                onOpenNewModal={() => setShowClientModal(true)}
                            />
                        )}

                        {activeTab === 'agenda' && (
                            <AgendaView processes={processes} />
                        )}

                        {activeTab === 'financial' && (
                            <FinancialView
                                financials={financials}
                                onOpenNewModal={() => setShowFinancialModal(true)}

                            />

                        {activeTab === 'documentos' && (

                        {activeTab === 'pecas_ia' && (

                        {activeTab === 'calculadora' && (

                        {activeTab === 'configuracoes' && (

                    {/* Modais da Aplicação */}

                        />
                    )}

                    {processModal && (
                        <ProcessModal

                    {selectedProcess && (

                        active

                    }`}
                >
                    <div className="flex items-center gap-3">

                        <span>{label}</span>

                        }`}>

                        </span>

            );
        }

        function DashboardView({ processes, clients, financials, onNavigate, onNewProcess, onNewClient }) {
            // Cálculos Rápidos
            const totalReceita = financials
                .filter(f => f.tipo === 'receita' && f.status === 'Pago')
                .reduce((acc, curr) => acc + curr.valor, 0);

            const totalPendente = financials
                .filter(f => f.tipo === 'receita' && f.status === 'Pendente')
                .reduce((acc, curr) => acc + curr.valor, 0);

            const proximosPrazos = processes
                .filter(p => p.proximoPrazo)

                            <p className="text-slate-500 text-sm mt-1">Visão geral do seu escritório autônomo e próximos compromissos.</p>

        function MetricCard({ title, value, icon, color, subtext }) {
            const colors = {
                blue: 'bg-blue-50 text-blue-600 border-blue-100',
                indigo: 'bg-indigo-50 text-indigo-600 border-indigo-100',
                emerald: 'bg-emerald-50 text-emerald-600 border-emerald-100',

            };

            return (

                    </div>
                </div>
            );
        }

        function AreaDistribution({ processes }) {
            const counts = processes.reduce((acc, p) => {
                acc[p.area] = (acc[p.area] || 0) + 1;
                return acc;
            }, {});

            const total = processes.length || 1;

            return (
                <div className="space-y-3">
                    {Object.entries(counts).map(([area, count]) => {
                        const pct = Math.round((count / total) * 100);
                        return (
                            <div key={area} className="space-y-1">
                                <div className="flex justify-between text-xs font-medium">
                                    <span className="text-slate-700">{area}</span>
                                    <span className="text-slate-500">{count} ({pct}%)</span>
                                </div>
                                <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                                    <div
                                        className="h-full bg-indigo-500 rounded-full"
                                        style={{ width: `${pct}%` }}

        function TJRJIntegrationView({ clients, onImportProcesses, supabaseClient }) {
            const [oab, setOab] = useState('');
            const [uf, setUf] = useState('RJ');
            const [loading, setLoading] = useState(false);
            const [resultados, setResultados] = useState([]);
            const [selecionados, setSelecionados] = useState(() => new Set());
            const [erro, setErro] = useState(null);
            const [aviso, setAviso] = useState(null);
            const [buscou, setBuscou] = useState(false);
            const [fonteDados, setFonteDados] = useState(null); // 'djen' | 'simulacao' | null

            // Converte o registro devolvido pela Edge Function para o formato
            // usado internamente pelo JurisControl (mesmo shape de INITIAL_PROCESSES).
            const mapearProcessoApi = (p) => {
                const nomeParte = p.poloAtivo || 'Parte não identificada';
                const clienteExistente = clients.find(
                    c => c.nome.trim().toLowerCase() === nomeParte.trim().toLowerCase()
                );
                return {
                    id: (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : ('proc-' + Date.now() + '-' + Math.random().toString(36).slice(2)),
                    numero: p.numero,
                    clienteId: clienteExistente ? clienteExistente.id : null,
                    clienteNome: clienteExistente ? clienteExistente.nome : nomeParte,
                    area: p.areaEstimada || 'Cível',
                    vara: p.orgaoJulgador || '',
                    acao: p.classe ? (p.assunto ? `${p.classe} - ${p.assunto}` : p.classe) : (p.assunto || 'Consulta TJRJ'),
                    status: 'Ativo',
                    fase: p.situacao || 'Em andamento',
                    valorCausa: 0,
                    honorariosContratados: 0,
                    proximoPrazo: null,
                    descricaoPrazo: '',
                    dataCadastro: new Date().toISOString().split('T')[0],
                    origem: 'tjrj',
                };
            };

            const buscarProcessos = async () => {
                if (!oab.trim()) {
                    setErro('Digite o número da OAB.');
                    return;
                }
                if (!supabaseClient) {
                    setErro('Cliente Supabase não inicializado. Verifique a configuração no topo do arquivo.');
                    return;
                }

                setLoading(true);
                setErro(null);
                setAviso(null);
                setBuscou(false);
                setFonteDados(null);

                try {
                    const { data, error } = await invocarFunction(supabaseClient, 'busca-tjrj', {
                        body: { oab: oab.trim(), uf },
                    });

                    if (error) throw error;

                    const lista = (data && data.processos) || [];
                    setResultados(lista);
                    setSelecionados(new Set(lista.map((_, idx) => idx)));
                    setBuscou(true);
                    setFonteDados((data && data.fonte) || null);

                    if (lista.length === 0) {
                        setErro((data && data.mensagem) || 'Nenhum processo encontrado para esta OAB.');
                    } else if (data && data.mensagem) {
                        setAviso(data.mensagem);
                    }
                } catch (err) {
                    console.error('Erro ao buscar processos no TJRJ:', err);
                    setErro('Erro ao buscar processos. Verifique se a Edge Function "busca-tjrj" está publicada no Supabase.');
                } finally {
                    setLoading(false);
                }
            };

            const alternarSelecao = (idx) => {
                setSelecionados(prev => {
                    const novo = new Set(prev);
                    if (novo.has(idx)) novo.delete(idx); else novo.add(idx);
                    return novo;
                });
            };

            const alternarTodos = () => {
                setSelecionados(prev =>
                    prev.size === resultados.length ? new Set() : new Set(resultados.map((_, idx) => idx))
                );
            };

            const importarSelecionados = () => {
                const escolhidos = resultados.filter((_, idx) => selecionados.has(idx));
                if (escolhidos.length === 0) {
                    setErro('Selecione ao menos um processo para importar.');
                    return;
                }
                onImportProcesses(escolhidos.map(mapearProcessoApi));
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <div className="flex flex-wrap items-center justify-between gap-3">
                            <div>
                                <h2 className="text-2xl font-bold text-slate-900">Integração TJRJ via DJEN</h2>
                                <p className="text-slate-500 text-sm mt-1">Busque publicações e intimações vinculadas a uma OAB e importe os processos identificados direto para a aba Processos.</p>
                            </div>
                            {buscou && fonteDados === 'djen' ? (
                                <span className="inline-flex items-center gap-2 px-3 py-1.5 bg-emerald-50 text-emerald-800 border border-emerald-200 rounded-full text-xs font-bold">
                                    <i className="fa-solid fa-circle-check"></i> Dados Reais (DJEN)
                                </span>
                            ) : (
                                <span className="inline-flex items-center gap-2 px-3 py-1.5 bg-amber-50 text-amber-800 border border-amber-200 rounded-full text-xs font-bold">
                                    <i className="fa-solid fa-flask"></i> {buscou ? 'Modo Simulação' : 'DJEN (CNJ)'}
                                </span>
                            )}
                        </div>
                        <p className="text-xs text-slate-400 mt-3 border-t border-slate-100 pt-3">
                            Esta busca consulta o <strong>DJEN</strong> (Diário de Justiça Eletrônico Nacional, mantido pelo CNJ),
                            que reúne as publicações/intimações de todos os tribunais — incluindo o TJRJ — pesquisáveis por número
                            de OAB, sem exigir convênio. Não é a "capa" completa do processo (para isso seria necessário o MNI, via
                            convênio institucional com o TJRJ), mas mostra o que efetivamente gerou movimentação/prazo para a OAB
                            nos últimos 90 dias. Se a consulta ao DJEN falhar (ex.: bloqueio temporário), o sistema cai
                            automaticamente para dados de demonstração e avisa você.
                        </p>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                        <div className="flex flex-col sm:flex-row gap-4">
                            <div className="w-full sm:w-24">
                                <label className="block text-xs font-semibold text-slate-600 mb-1">UF</label>
                                <select value={uf} onChange={e => setUf(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                                    <option value="RJ">RJ</option>
                                    <option value="SP">SP</option>
                                </select>
                            </div>
                            <div className="flex-1">
                                <label className="block text-xs font-semibold text-slate-600 mb-1">Número da OAB</label>
                                <input
                                    type="text"
                                    value={oab}
                                    onChange={e => setOab(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && buscarProcessos()}
                                    placeholder="Ex: 123456"
                                    className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                />
                            </div>
                            <div className="flex items-end">
                                <button
                                    onClick={buscarProcessos}
                                    disabled={loading}
                                    className="w-full sm:w-auto px-6 py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold rounded-xl text-sm flex items-center justify-center gap-2 shadow-sm transition disabled:opacity-60"
                                >
                                    {loading ? <><i className="fa-solid fa-spinner fa-spin"></i> Buscando...</> : <><i className="fa-solid fa-magnifying-glass"></i> Buscar Processos</>}
                                </button>
                            </div>
                        </div>
                    </div>

                    {erro && (
                        <div className="p-4 bg-rose-50 text-rose-700 rounded-xl border border-rose-200 flex items-center gap-3 text-sm">
                            <i className="fa-solid fa-triangle-exclamation text-lg"></i> {erro}
                        </div>
                    )}
                    {aviso && (
                        <div className="p-4 bg-amber-50 text-amber-800 rounded-xl border border-amber-200 flex items-center gap-3 text-sm">
                            <i className="fa-solid fa-circle-info text-lg"></i> {aviso}
                        </div>
                    )}

                    {buscou && resultados.length > 0 && (
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                            <div className="p-4 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3 bg-slate-50">
                                <h3 className="font-bold text-slate-900">Resultados ({resultados.length})</h3>
                                <button
                                    onClick={importarSelecionados}
                                    className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-lg transition shadow-sm flex items-center gap-2"
                                >
                                    <i className="fa-solid fa-download"></i> Importar Selecionados ({selecionados.size})
                                </button>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-slate-100 border-b border-slate-200 text-xs text-slate-500 font-bold uppercase tracking-wider">
                                        <tr>
                                            <th className="p-3 w-10 text-center">
                                                <input type="checkbox" checked={selecionados.size === resultados.length} onChange={alternarTodos} className="rounded" />
                                            </th>
                                            <th className="p-3">Número (CNJ)</th>
                                            <th className="p-3">Parte / Polo Ativo</th>
                                            <th className="p-3">Classe / Assunto</th>
                                            <th className="p-3">Órgão Julgador</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {resultados.map((proc, idx) => (
                                            <tr key={idx} className="hover:bg-amber-50/50 transition">
                                                <td className="p-3 text-center">
                                                    <input type="checkbox" checked={selecionados.has(idx)} onChange={() => alternarSelecao(idx)} className="rounded" />
                                                </td>
                                                <td className="p-3 font-mono font-medium text-slate-900">{proc.numero}</td>
                                                <td className="p-3 text-slate-800">{proc.poloAtivo}</td>
                                                <td className="p-3 text-slate-600">

                            </div>

                </div>

        }

            const atualizarFeed = async () => {
                if (oabsMonitoradas.length === 0) {
                    setErro('Cadastre ao menos uma OAB para monitorar (abaixo) antes de atualizar.');
                    return;
                }
                if (!supabaseClient) {
                    setErro('Cliente Supabase não inicializado.');
                    return;
                }

                setLoading(true);
                setErro(null);
                setAviso(null);

                const avisos = [];
                let todosNovos = [];

                for (const registro of oabsMonitoradas) {
                    try {
                        const { data, error } = await invocarFunction(supabaseClient, 'busca-tjrj', {
                            body: { oab: registro.oab, uf: registro.uf },
                        });
                        if (error) throw error;
                        const comunicacoes = (data && data.comunicacoes) || [];
                        todosNovos = todosNovos.concat(comunicacoes.map(c => ({
                            ...c,
                            status: 'nao_tratada',
                            oabOrigem: registro.label,
                        })));
                        if (data && data.simulado) {
                            avisos.push(`${registro.label}: modo simulação (${data.mensagem || 'DJEN indisponível'})`);
                        }
                    } catch (err) {
                        console.error('Erro ao atualizar alertas para', registro, err);
                        avisos.push(`${registro.label}: falha ao consultar (${err.message || err})`);
                    }
                }

                onMergeAlertas(todosNovos);
                setLoading(false);
                if (avisos.length > 0) setAviso(avisos.join(' | '));
            };

            const adicionarOab = () => {
                if (!novaOab.trim()) {
                    setErro('Digite o número da OAB.');
                    return;
                }
                onAddOab(novaOab.trim(), novaUf, `OAB ${novaOab.trim()}/${novaUf}`);
                setNovaOab('');
            };

            const alertasFiltrados = filtro === 'todos' ? alertas : alertas.filter(a => a.status === filtro);

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">

                            </div>
                            <button
                                onClick={atualizarFeed}
                                disabled={loading}
                                className="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold rounded-lg text-sm flex items-center gap-2 shadow-sm transition disabled:opacity-60"
                            >
                                {loading ? <><i className="fa-solid fa-spinner fa-spin"></i> Atualizando...</> : <><i className="fa-solid fa-rotate-right"></i> Atualizar Feed</>}
                            </button>
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
                        <h3 className="text-sm font-bold text-slate-700 mb-3">OABs monitoradas</h3>
                        <div className="flex flex-wrap gap-2 mb-4">
                            {oabsMonitoradas.length === 0 && <p className="text-xs text-slate-400">Nenhuma OAB cadastrada ainda.</p>}
                            {oabsMonitoradas.map(o => (
                                <span key={o.id} className="inline-flex items-center gap-2 px-3 py-1.5 bg-slate-100 text-slate-700 rounded-full text-xs font-medium">
                                    {o.label}
                                    <button onClick={() => onRemoveOab(o.id)} className="text-slate-400 hover:text-rose-600"><i className="fa-solid fa-xmark"></i></button>
                                </span>
                            ))}
                        </div>
                        <div className="flex gap-2">
                            <select value={novaUf} onChange={e => setNovaUf(e.target.value)} className="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm w-24">
                                <option value="RJ">RJ</option>
                                <option value="SP">SP</option>
                            </select>
                            <input
                                type="text"
                                value={novaOab}
                                onChange={e => setNovaOab(e.target.value)}
                                onKeyDown={e => e.key === 'Enter' && adicionarOab()}
                                placeholder="Número da OAB a monitorar"
                                className="flex-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm"
                            />
                            <button onClick={adicionarOab} className="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-sm font-semibold">
                                <i className="fa-solid fa-plus mr-1"></i> Adicionar
                            </button>
                        </div>
                    </div>

                    {erro && <div className="p-4 bg-rose-50 text-rose-700 rounded-xl border border-rose-200 flex items-center gap-3 text-sm"><i className="fa-solid fa-triangle-exclamation text-lg"></i> {erro}</div>}

                    <div className="flex gap-2 flex-wrap">

        function IndicadoresView({ processes, clients, financials }) {
            const hoje = new Date();
            const dias30atras = new Date(hoje); dias30atras.setDate(dias30atras.getDate() - 30);

            const comMovimentacao = processes.filter(p => p.dataCadastro && new Date(p.dataCadastro + 'T00:00:00') >= dias30atras);
            const semMovimentacao = processes.length - comMovimentacao.length;

            // Processos cadastrados por mês, últimos 6 meses
            const meses = [];
            for (let i = 5; i >= 0; i--) {
                const d = new Date(hoje.getFullYear(), hoje.getMonth() - i, 1);
                meses.push({ chave: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`, label: d.toLocaleDateString('pt-BR', { month: 'short' }) });
            }
            const contagemPorMes = meses.map(m => ({
                ...m,
                total: processes.filter(p => (p.dataCadastro || '').startsWith(m.chave)).length,
            }));
            const maxMes = Math.max(1, ...contagemPorMes.map(m => m.total));

            const porKanban = COLUNAS_KANBAN.map(c => ({
                ...c,
                total: processes.filter(p => (p.kanbanStatus || 'A Fazer') === c.id).length,
            }));

            const totalRecebido = financials.filter(f => f.tipo === 'receita' && f.status === 'Pago').reduce((a, b) => a + b.valor, 0);
            const totalPendente = financials.filter(f => f.tipo === 'receita' && f.status === 'Pendente').reduce((a, b) => a + b.valor, 0);
            const totalDespesas = financials.filter(f => f.tipo === 'despesa').reduce((a, b) => a + b.valor, 0);
            const maxFinanceiro = Math.max(1, totalRecebido, totalPendente, totalDespesas);

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h2 className="text-2xl font-bold text-slate-900">Indicadores</h2>

                            <div className="flex gap-8">
                                <div>
                                    <div className="text-3xl font-extrabold text-blue-600">{comMovimentacao.length}</div>
                                    <div className="text-xs text-slate-500">Com movimentação</div>
                                </div>
                                <div>
                                    <div className="text-3xl font-extrabold text-slate-400">{semMovimentacao}</div>
                                    <div className="text-xs text-slate-500">Sem movimentação</div>
                                </div>
                            </div>

        // Gera o texto de uma minuta a partir de cliente + (opcionalmente) processo +

        function gerarTextoDocumento({ template, currentClient, currentProcess, advogadoNome, advogadoOab, valorRecibo, assuntoNotificacao }) {
            if (!currentClient) return 'Cadastre ao menos um cliente para gerar documentos.';
            const dataExtenso = new Date().toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' });
            const referenciaProcesso = currentProcess
                ? `\n\nREFERENTE AO PROCESSO Nº ${currentProcess.numero}, em trâmite perante ${currentProcess.vara || 'o juízo competente'}.`
                : '';

            if (template === 'procuracao') {
                return `PROCURAÇÃO AD JUDICIA ET EXTRA

OUTORGANTE: ${currentClient.nome.toUpperCase()}, ${currentClient.tipo === 'PF' ? `portador(a) do CPF nº ${currentClient.documento}, residente e domiciliado(a) na ${currentClient.endereco}, ${currentClient.cidade}/${currentClient.uf}` : `pessoa jurídica de direito privado inscrita no CNPJ sob o nº ${currentClient.documento}, com sede na ${currentClient.endereco}, ${currentClient.cidade}/${currentClient.uf}`}.

OUTORGADO: ${advogadoNome.toUpperCase()}, inscrito(a) na OAB sob o nº ${advogadoOab}.

PODERES: Pelo presente instrumento, o(a) Outorgante concede ao Outorgado amplos poderes para o foro em geral, conferindo-lhe os da cláusula "ad judicia et extra", em qualquer Juízo, Tribunal ou Ordem Administrativa, podendo propor contra quem de direito as ações competentes e defendê-lo(a) nas contrárias, confessar, reconhecer a procedência do pedido, transigir, desistir, renunciar ao direito sobre o qual se funda a ação, receber, dar quitação e firmar compromissos.${referenciaProcesso}

${currentClient.cidade}/${currentClient.uf}, ${dataExtenso}.


________________________________________________________
${currentClient.nome.toUpperCase()}
Outorgante`;
            }

            if (template === 'contrato_honorarios') {
                return `CONTRATO DE PRESTAÇÃO DE SERVIÇOS ADVOCATÍCIOS E HONORÁRIOS

CONTRATANTE: ${currentClient.nome}, inscrito(a) sob o Doc nº ${currentClient.documento}, com endereço na ${currentClient.endereco}, ${currentClient.cidade}/${currentClient.uf}.

CONTRATADO: ${advogadoNome}, OAB nº ${advogadoOab}.

CLÁUSULA PRIMEIRA - DO OBJETO
O CONTRATADO compromete-se a prestar assistência jurídica ao CONTRATANTE para propositura e acompanhamento de ação judicial pertinente à defesa de seus interesses.${referenciaProcesso}

CLÁUSULA SEGUNDA - DOS HONORÁRIOS
Pelos serviços prestados, o CONTRATANTE pagará ao CONTRATADO o valor fixo pactuado, além do percentual de 20% (vinte por cento) sobre o êxito econômico alcançado ao final do processo.

CLÁUSULA TERCEIRA - DO FORO
Para dirimir quaisquer dúvidas oriundas deste contrato, as partes elegem o foro da Comarca de ${currentClient.cidade}/${currentClient.uf}.

${currentClient.cidade}/${currentClient.uf}, ${dataExtenso}.


________________________________________         ________________________________________
CONTRATANTE                                      CONTRATADO`;
            }

            if (template === 'recibo_honorarios') {
                return `RECIBO DE HONORÁRIOS ADVOCATÍCIOS

Recebi de ${currentClient.nome}, ${currentClient.tipo === 'PF' ? `CPF nº ${currentClient.documento}` : `CNPJ nº ${currentClient.documento}`}, a importância de ${valorRecibo ? `R$ ${valorRecibo}` : '[VALOR A PREENCHER]'}, referente a honorários advocatícios${currentProcess ? ` do processo nº ${currentProcess.numero}` : ''}, para os devidos fins e efeitos de direito.

${currentClient.cidade}/${currentClient.uf}, ${dataExtenso}.


________________________________________________________
${advogadoNome.toUpperCase()}
OAB nº ${advogadoOab}`;
            }

            if (template === 'notificacao_extrajudicial') {
                return `NOTIFICAÇÃO EXTRAJUDICIAL

AO(À): ${currentClient.nome.toUpperCase()}
${currentClient.endereco || ''}, ${currentClient.cidade}/${currentClient.uf}

Pela presente, vimos notificá-lo(a) para que, no prazo de 10 (dez) dias a contar do recebimento desta, regularize a situação relativa a: ${assuntoNotificacao || '[DESCREVER O ASSUNTO DA NOTIFICAÇÃO]'}.${referenciaProcesso}

O não atendimento desta notificação no prazo estipulado ensejará a adoção das medidas judiciais cabíveis, sem prejuízo de outras sanções previstas em lei ou contrato.

${currentClient.cidade}/${currentClient.uf}, ${dataExtenso}.


________________________________________________________
${advogadoNome.toUpperCase()}
OAB nº ${advogadoOab}`;
            }

            return '';
        }

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

                                    className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                >

                                        <option key={c.id} value={c.id}>{c.nome} ({c.documento})</option>
                                    ))}

                            </div>

                            {!processoFixo && (
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Processo relacionado (opcional)</label>
                                    <select
                                        value={selectedProcessId}
                                        onChange={(e) => setSelectedProcessId(e.target.value)}
                                        className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                    >
                                        <option value="">Nenhum (documento avulso)</option>

                                            <option key={p.id} value={p.id}>{p.numero} — {p.clienteNome}</option>
                                        ))}

                            {selectedTemplate === 'recibo_honorarios' && (

                            <div className="pt-4 border-t border-slate-100 flex flex-col gap-2">

        const TIPOS_PECA_IA = [
            "Petição Inicial",
            "Contestação",
            "Réplica",
            "Recurso de Apelação",
            "Recurso Especial",
            "Parecer Jurídico",
            "Notificação Extrajudicial",
            "Contrato de Honorários Advocatícios",
            "Procuração Ad Judicia Et Extra",
            "Outro (descrever nas instruções)",
        ];

        // Escolhe qual provedor/chave usar numa chamada de IA: prioriza uma chave
        // Anthropic conectada pelo usuário, depois uma chave Gemini conectada, e só
        // por último cai pro plano gratuito (sem apiKey — a function usa o Gemini
        // da casa e conta na cota mensal).
        async function resolverProvedorIA() {
            const [chaveClaude, chaveGemini] = await Promise.all([getSecret('ANTHROPIC_API_KEY'), getSecret('GEMINI_API_KEY')]);
            if (chaveClaude) return { apiKey: chaveClaude, provedor: 'anthropic' };
            if (chaveGemini) return { apiKey: chaveGemini, provedor: 'gemini' };
            return { apiKey: null, provedor: null };
        }

        // Mostra quantas gerações gratuitas já foram usadas este mês, ou avisa que o
        // uso é ilimitado quando há uma chave própria conectada. Consulta
        // uso_ia_gratuita direto (a tabela tem uma policy de leitura só da própria
        // linha), sem precisar chamar nenhuma function.
        function UsoIAGratuitaBanner({ supabaseClient, session }) {
            const [estado, setEstado] = useState(null);

            useEffect(() => {
                let cancelado = false;
                (async () => {
                    const { apiKey } = await resolverProvedorIA();
                    if (apiKey) {
                        if (!cancelado) setEstado({ temChavePropria: true });
                        return;
                    }
                    const mes = new Date().toISOString().slice(0, 7);
                    const { data } = await supabaseClient
                        .from('uso_ia_gratuita').select('contagem')
                        .eq('user_id', session.user.id).eq('mes', mes).maybeSingle();
                    if (!cancelado) setEstado({ temChavePropria: false, usadas: data?.contagem ?? 0 });
                })();
                return () => { cancelado = true; };
            }, [session.user.id]);

            if (!estado) return null;
            if (estado.temChavePropria) {
                return (
                    <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-xs text-emerald-800 flex items-center gap-2">
                        <i className="fa-solid fa-infinity"></i> Usando sua própria chave conectada — gerações ilimitadas.
                    </div>
                );
            }
            const restantes = Math.max(0, 10 - estado.usadas);
            return (
                <div className={`p-3 rounded-xl text-xs border flex items-center gap-2 ${restantes === 0 ? 'bg-rose-50 border-rose-200 text-rose-700' : 'bg-amber-50 border-amber-200 text-amber-800'}`}>
                    <i className="fa-solid fa-gift"></i>
                    IA gratuita: {estado.usadas} de 10 gerações usadas este mês{restantes === 0 ? ' — conecte sua chave em Configurações para continuar' : ''}.
                </div>
            );
        }

        function CriacaoPecasIAView({ clients, processes, supabaseClient, session }) {
            const [tipoPeca, setTipoPeca] = useState(TIPOS_PECA_IA[0]);
            const [clienteId, setClienteId] = useState('');
            const [processoId, setProcessoId] = useState('');
            const [instrucoes, setInstrucoes] = useState('');
            const [loading, setLoading] = useState(false);
            const [erro, setErro] = useState(null);
            // Muda a cada geração bem-sucedida — usado como `key` do banner de uso
            // gratuito abaixo, pra forçar ele a reconsultar a contagem atualizada.
            const [atualizacoesUso, setAtualizacoesUso] = useState(0);
            const [resultado, setResultado] = useState(null);

            const gerar = async () => {
                if (!supabaseClient) {
                    setErro('Cliente Supabase não inicializado.');
                    return;
                }

                setLoading(true);
                setErro(null);
                setResultado(null);

                const clienteSelecionado = clients.find(c => c.id === clienteId);
                const processoSelecionado = processes.find(p => p.id === processoId);
                const { apiKey, provedor } = await resolverProvedorIA();

                try {
                    const { data, error } = await invocarFunction(supabaseClient, 'criar-peca-ia', {
                        body: {
                            tarefa: 'minuta',
                            contexto: {
                                tipoPeca,
                                instrucoes,
                                cliente: clienteSelecionado || undefined,
                                processo: processoSelecionado || undefined,
                            },
                            apiKey: apiKey || undefined,
                            provedor: provedor || undefined,
                        },
                    });

                    if (error) throw error;
                    if (data && data.error) {
                        setErro(data.error);
                        return;
                    }

                    setResultado(data);
                    setAtualizacoesUso(n => n + 1);
                } catch (err) {
                    console.error('Erro ao gerar peça com IA:', err);
                    setErro('Erro ao gerar a peça. Verifique sua conexão, ou conecte sua própria chave em Configurações se o plano gratuito estiver indisponível.');
                } finally {
                    setLoading(false);
                }
            };

            const copiarTexto = () => {
                if (!resultado?.texto) return;
                const textArea = document.createElement('textarea');
                textArea.value = resultado.texto;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('Texto copiado para a área de transferência!');
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <div className="flex items-center gap-2">
                            <h2 className="text-2xl font-bold text-slate-900">Criação de Peças com IA</h2>
                            <span className="px-2 py-0.5 bg-indigo-50 text-indigo-700 text-xs font-bold rounded">IA</span>
                        </div>
                        <p className="text-slate-500 text-sm mt-1">Gere minutas de peças jurídicas com IA, usando os dados de clientes e processos já cadastrados. Todo texto gerado precisa de revisão humana antes do uso.</p>
                    </div>

                    <UsoIAGratuitaBanner key={atualizacoesUso} supabaseClient={supabaseClient} session={session} />

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                            <h3 className="font-bold text-slate-900 text-base">Parâmetros</h3>

                            <div>
                                <label className="block text-xs font-semibold text-slate-600 mb-1">Tipo de Peça</label>
                                <select value={tipoPeca} onChange={e => setTipoPeca(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                                    {TIPOS_PECA_IA.map(t => <option key={t} value={t}>{t}</option>)}
                                </select>
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-slate-600 mb-1">Cliente (opcional)</label>
                                <select value={clienteId} onChange={e => setClienteId(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                                    <option value="">Nenhum</option>
                                    {clients.map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}
                                </select>
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-slate-600 mb-1">Processo (opcional)</label>
                                <select value={processoId} onChange={e => setProcessoId(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                                    <option value="">Nenhum</option>
                                    {processes.map(p => <option key={p.id} value={p.id}>{p.numero}</option>)}
                                </select>
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-slate-600 mb-1">Instruções adicionais</label>
                                <textarea
                                    value={instrucoes}
                                    onChange={e => setInstrucoes(e.target.value)}
                                    rows={5}
                                    placeholder="Ex: pedir tutela de urgência, focar em dano moral, incluir cláusula de reajuste anual..."
                                    className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                />
                            </div>

                            <button
                                onClick={gerar}
                                disabled={loading}
                                className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm flex items-center justify-center gap-2 transition disabled:opacity-60"
                            >
                                {loading ? <><i className="fa-solid fa-spinner fa-spin"></i> Gerando...</> : <><i className="fa-solid fa-wand-magic-sparkles"></i> Gerar com IA</>}

        function ConfiguracoesView({ session, supabaseClient }) {

            const [oabPerfil, setOabPerfil] = useState(session?.user?.user_metadata?.oab || '');
            const [salvandoPerfil, setSalvandoPerfil] = useState(false);
            const [mensagemPerfil, setMensagemPerfil] = useState(null);

            const salvarPerfil = async (e) => {
                e.preventDefault();
                setSalvandoPerfil(true);
                setMensagemPerfil(null);
                const { error } = await supabaseClient.auth.updateUser({ data: { nome: nomePerfil.trim(), oab: oabPerfil.trim() } });
                setSalvandoPerfil(false);
                setMensagemPerfil(error
                    ? { tipo: 'erro', texto: error.message }
                    : { tipo: 'sucesso', texto: 'Perfil atualizado!' });
            };

            const carregar = async () => {
                setSeguro(await armazenamentoSeguroDisponivel());
                const lista = [];
                for (const s of SECRETS_DISPONIVEIS) {
                    if (await getSecret(s.chave)) lista.push(s.chave);
                }
                setConfiguradas(lista);
            };

            useEffect(() => { carregar(); }, []);

            const salvar = async (chave) => {
                const valor = (valores[chave] || '').trim();
                if (!valor) { setMensagem({ tipo: 'erro', texto: 'Digite um valor antes de salvar.' }); return; }
                setSalvando(chave);
                const resultado = await setSecret(chave, valor);
                setSalvando('');
                if (resultado && resultado.ok) {
                    setMensagem({
                        tipo: 'sucesso',
                        texto: resultado.seguro ? 'Chave salva com segurança neste computador.' : 'Chave salva neste navegador (não criptografada — evite usar num computador compartilhado).',
                    });
                    setValores(v => ({ ...v, [chave]: '' }));
                    carregar();
                } else {
                    setMensagem({ tipo: 'erro', texto: (resultado && resultado.erro) || 'Falha ao salvar.' });
                }
            };

            const remover = async (chave) => {
                setSalvando(chave);

                            </div>
                        </form>
                    </div>

                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                        <h3 className="font-bold text-slate-900 text-sm mb-1">Conectar sua IA (opcional)</h3>
                        <p className="text-slate-500 text-xs">Por padrão, a Criação de Peças usa o plano gratuito (Gemini, 10 gerações/mês, sem configurar nada). Conecte sua própria chave aqui só se quiser uso ilimitado — o custo passa a ser cobrado direto de você pelo provedor escolhido, nunca pelo JurisControl. As chaves nunca reaparecem na tela depois de salvas.</p>
                    </div>

                    {seguro === true && (

                            <i className="fa-solid fa-lock mr-2"></i>

                    {seguro === false && (

                            <i className="fa-solid fa-triangle-exclamation mr-2"></i>

                        </div>
                    )}

                    {mensagem && (
                        <div className={`p-4 rounded-xl border text-sm ${mensagem.tipo === 'sucesso' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-rose-50 text-rose-700 border-rose-200'}`}>
                            {mensagem.texto}

                    )}

                    <div className="space-y-4">
                        {SECRETS_DISPONIVEIS.map(s => {

                            return (
                                <div key={s.chave} className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5">
                                    <div className="flex items-center justify-between mb-1">
                                        <h3 className="font-bold text-slate-900 text-sm">{s.label}</h3>
                                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded uppercase ${jaConfigurada ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'}`}>
                                            {jaConfigurada ? 'Configurada' : 'Não configurada'}
                                        </span>
                                    </div>
                                    <p className="text-xs text-slate-400 mb-3">{s.ajuda}</p>
                                    <div className="flex gap-2">
                                        <div className="flex-1 relative">
                                            <input
                                                type={mostrar[s.chave] ? 'text' : 'password'}
                                                value={valores[s.chave] || ''}
                                                onChange={e => setValores(v => ({ ...v, [s.chave]: e.target.value }))}
                                                placeholder={jaConfigurada ? 'Digite um novo valor para substituir' : 'Cole a chave aqui'}
                                                className="w-full p-2.5 pr-10 bg-slate-50 border border-slate-200 rounded-xl text-sm font-mono disabled:opacity-50"
                                            />
                                            <button type="button" onClick={() => setMostrar(m => ({ ...m, [s.chave]: !m[s.chave] }))} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                                                <i className={`fa-solid ${mostrar[s.chave] ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                            </button>
                                        </div>
                                        <button
                                            onClick={() => salvar(s.chave)}
                                            disabled={salvando === s.chave}
                                            className="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold rounded-xl text-sm disabled:opacity-50"
                                        >
                                            {salvando === s.chave ? <i className="fa-solid fa-spinner fa-spin"></i> : 'Salvar'}
