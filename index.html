        function TJRJIntegrationView({ clients, onImportProcesses, supabaseClient }) {
            const [oab, setOab] = useState('');
            const [uf, setUf] = useState('RJ');
            const [loading, setLoading] = useState(false);
            const [resultados, setResultados] = useState([]);
            const [selecionados, setSelecionados] = useState(() => new Set());
            const [erro, setErro] = useState(null);
            const [aviso, setAviso] = useState(null);
            const [buscou, setBuscou] = useState(false);
            const [fonteDados, setFonteDados] = useState(null); // 'djen' | 'simulacao' | null

            // Converte o registro devolvido pela Edge Function para o formato
            // usado internamente pelo JurisControl (mesmo shape de INITIAL_PROCESSES).
            const mapearProcessoApi = (p) => {
                const nomeParte = p.poloAtivo || 'Parte não identificada';
                const clienteExistente = clients.find(
                    c => c.nome.trim().toLowerCase() === nomeParte.trim().toLowerCase()
                );
                return {
                    id: (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : ('proc-' + Date.now() + '-' + Math.random().toString(36).slice(2)),
                    numero: p.numero,
                    clienteId: clienteExistente ? clienteExistente.id : null,
                    clienteNome: clienteExistente ? clienteExistente.nome : nomeParte,
                    area: p.areaEstimada || 'Cível',
                    vara: p.orgaoJulgador || '',
                    acao: p.classe ? (p.assunto ? `${p.classe} - ${p.assunto}` : p.classe) : (p.assunto || 'Consulta TJRJ'),
                    status: 'Ativo',
                    fase: p.situacao || 'Em andamento',
                    valorCausa: 0,
                    honorariosContratados: 0,
                    proximoPrazo: null,
                    descricaoPrazo: '',
                    dataCadastro: new Date().toISOString().split('T')[0],
                    origem: 'tjrj',
                };
            };

            const buscarProcessos = async () => {
                if (!oab.trim()) {
                    setErro('Digite o número da OAB.');
                    return;
                }
                if (!supabaseClient) {
                    setErro('Cliente Supabase não inicializado. Verifique a configuração no topo do arquivo.');
                    return;
                }

                setLoading(true);
                setErro(null);
                setAviso(null);
                setBuscou(false);
                setFonteDados(null);

                try {
                    const { data, error } = await invocarFunction(supabaseClient, 'busca-tjrj', {
                        body: { oab: oab.trim(), uf },
                    });

                    if (error) throw error;

                    const lista = (data && data.processos) || [];
                    setResultados(lista);
                    setSelecionados(new Set(lista.map((_, idx) => idx)));
                    setBuscou(true);
                    setFonteDados((data && data.fonte) || null);

                    if (lista.length === 0) {
                        setErro((data && data.mensagem) || 'Nenhum processo encontrado para esta OAB.');
                    } else if (data && data.mensagem) {
                        setAviso(data.mensagem);
                    }
                } catch (err) {
                    console.error('Erro ao buscar processos no TJRJ:', err);
                    setErro('Erro ao buscar processos. Verifique se a Edge Function "busca-tjrj" está publicada no Supabase.');
                } finally {
                    setLoading(false);
                }
            };

            const alternarSelecao = (idx) => {
                setSelecionados(prev => {
                    const novo = new Set(prev);
                    if (novo.has(idx)) novo.delete(idx); else novo.add(idx);
                    return novo;
                });
            };

            const alternarTodos = () => {
                setSelecionados(prev =>
                    prev.size === resultados.length ? new Set() : new Set(resultados.map((_, idx) => idx))
                );
            };

            const importarSelecionados = () => {
                const escolhidos = resultados.filter((_, idx) => selecionados.has(idx));
                if (escolhidos.length === 0) {
                    setErro('Selecione ao menos um processo para importar.');
                    return;
                }
                onImportProcesses(escolhidos.map(mapearProcessoApi));
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-stone-200">
                        <div className="flex flex-wrap items-center justify-between gap-3">
                            <div>
                                <h2 className="text-2xl font-bold text-stone-900">Integração TJRJ via DJEN</h2>
                                <p className="text-stone-500 text-sm mt-1">Busque publicações e intimações vinculadas a uma OAB e importe os processos identificados direto para a aba Processos.</p>
                            </div>
                            {buscou && fonteDados === 'djen' ? (
                                <span className="inline-flex items-center gap-2 px-3 py-1.5 bg-emerald-50 text-emerald-800 border border-emerald-200 rounded-full text-xs font-bold">
                                    <i className="fa-solid fa-circle-check"></i> Dados Reais (DJEN)
                                </span>
                            ) : (
                                <span className="inline-flex items-center gap-2 px-3 py-1.5 bg-amber-50 text-amber-800 border border-amber-200 rounded-full text-xs font-bold">
                                    <i className="fa-solid fa-flask"></i> {buscou ? 'Modo Simulação' : 'DJEN (CNJ)'}
                                </span>
                            )}
                        </div>
                        <p className="text-xs text-stone-400 mt-3 border-t border-stone-100 pt-3">
                            Esta busca consulta o <strong>DJEN</strong> (Diário de Justiça Eletrônico Nacional, mantido pelo CNJ),
                            que reúne as publicações/intimações de todos os tribunais — incluindo o TJRJ — pesquisáveis por número
                            de OAB, sem exigir convênio. Não é a "capa" completa do processo (para isso seria necessário o MNI, via
                            convênio institucional com o TJRJ), mas mostra o que efetivamente gerou movimentação/prazo para a OAB
                            nos últimos 90 dias. Se a consulta ao DJEN falhar (ex.: bloqueio temporário), o sistema cai
                            automaticamente para dados de demonstração e avisa você.
                        </p>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-stone-200 p-6">
                        <div className="flex flex-col sm:flex-row gap-4">
                            <div className="w-full sm:w-24">
                                <label className="block text-xs font-semibold text-stone-600 mb-1">UF</label>
                                <select value={uf} onChange={e => setUf(e.target.value)} className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                                    <option value="RJ">RJ</option>
                                    <option value="SP">SP</option>
                                </select>
                            </div>
                            <div className="flex-1">
                                <label className="block text-xs font-semibold text-stone-600 mb-1">Número da OAB</label>
                                <input
                                    type="text"
                                    value={oab}
                                    onChange={e => setOab(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && buscarProcessos()}
                                    placeholder="Ex: 123456"
                                    className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                />
                            </div>
                            <div className="flex items-end">
                                <button
                                    onClick={buscarProcessos}
                                    disabled={loading}
                                    className="w-full sm:w-auto px-6 py-2.5 bg-amber-500 hover:bg-amber-600 text-stone-950 font-semibold rounded-xl text-sm flex items-center justify-center gap-2 shadow-sm transition disabled:opacity-60"
                                >
                                    {loading ? <><i className="fa-solid fa-spinner fa-spin"></i> Buscando...</> : <><i className="fa-solid fa-magnifying-glass"></i> Buscar Processos</>}
                                </button>
                            </div>
                        </div>
                    </div>

                    {erro && (
                        <div className="p-4 bg-rose-50 text-rose-700 rounded-xl border border-rose-200 flex items-center gap-3 text-sm">
                            <i className="fa-solid fa-triangle-exclamation text-lg"></i> {erro}
                        </div>
                    )}
                    {aviso && (
                        <div className="p-4 bg-amber-50 text-amber-800 rounded-xl border border-amber-200 flex items-center gap-3 text-sm">
                            <i className="fa-solid fa-circle-info text-lg"></i> {aviso}
                        </div>
                    )}

                    {buscou && resultados.length > 0 && (
                        <div className="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden">
                            <div className="p-4 border-b border-stone-200 flex flex-wrap items-center justify-between gap-3 bg-stone-50">
                                <h3 className="font-bold text-stone-900">Resultados ({resultados.length})</h3>
                                <button
                                    onClick={importarSelecionados}
                                    className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-lg transition shadow-sm flex items-center gap-2"
                                >
                                    <i className="fa-solid fa-download"></i> Importar Selecionados ({selecionados.size})
                                </button>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-stone-100 border-b border-stone-200 text-xs text-stone-500 font-bold uppercase tracking-wider">
                                        <tr>
                                            <th className="p-3 w-10 text-center">
                                                <input type="checkbox" checked={selecionados.size === resultados.length} onChange={alternarTodos} className="rounded" />
                                            </th>
                                            <th className="p-3">Número (CNJ)</th>
                                            <th className="p-3">Parte / Polo Ativo</th>
                                            <th className="p-3">Classe / Assunto</th>
                                            <th className="p-3">Órgão Julgador</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-stone-100">
                                        {resultados.map((proc, idx) => (
                                            <tr key={idx} className="hover:bg-amber-50/50 transition">
                                                <td className="p-3 text-center">
                                                    <input type="checkbox" checked={selecionados.has(idx)} onChange={() => alternarSelecao(idx)} className="rounded" />
                                                </td>
                                                <td className="p-3 font-mono font-medium text-stone-900">{proc.numero}</td>
                                                <td className="p-3 text-stone-800">{proc.poloAtivo}</td>
                                                <td className="p-3 text-stone-600">
                                                    {proc.classe}
                                                    {proc.assunto && <div className="text-xs text-stone-400">{proc.assunto}</div>}
                                                </td>
                                                <td className="p-3 text-stone-600 text-xs">{proc.orgaoJulgador}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const COLUNAS_KANBAN = [
            { id: 'A Fazer', label: 'A Fazer', accent: 'border-t-stone-400' },
            { id: 'Em Andamento', label: 'Em Andamento', accent: 'border-t-blue-500' },
            { id: 'Aguardando Prazo', label: 'Aguardando Prazo/Diligência', accent: 'border-t-amber-500' },
            { id: 'Concluído', label: 'Concluído', accent: 'border-t-emerald-500' },
        ];

        // Badge de urgência de prazo — mesma paleta semântica usada no resto do app
        // (vermelho = vencido/urgente, âmbar = atenção, sem badge = sem prazo ou folga).
        function BadgePrazoKanban({ dataISO }) {
            const urgencia = calcularUrgenciaPrazo(dataISO);
            if (!urgencia || urgencia.nivel === 'ok') return null;
            const estilos = {
                vencido: 'bg-rose-100 text-rose-700',
                urgente: 'bg-rose-50 text-rose-600',
                atencao: 'bg-amber-50 text-amber-700',
            };
            return (
                <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${estilos[urgencia.nivel]}`}>
                    <i className="fa-solid fa-clock mr-1"></i>{urgencia.label}
                </span>
            );
        }

        function KanbanView({ processes, onUpdateStatus, onSelectProcess, onEditProcess }) {
            const [arrastandoId, setArrastandoId] = useState(null);
            const [colunaSobrevoada, setColunaSobrevoada] = useState(null);

            const moverPara = (processoId, novoStatus) => {
                onUpdateStatus(processoId, novoStatus);
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-stone-200">
                        <h2 className="text-2xl font-bold text-stone-900">Kanban de Processos</h2>
                        <p className="text-stone-500 text-sm mt-1">Organize o andamento interno dos seus processos. Arraste os cartões entre as colunas ou use as setas.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
                        {COLUNAS_KANBAN.map((coluna, colIdx) => {
                            const itens = processes.filter(p => (p.kanbanStatus || 'A Fazer') === coluna.id);
                            return (
                                <div
                                    key={coluna.id}
                                    onDragOver={(e) => { e.preventDefault(); setColunaSobrevoada(coluna.id); }}
                                    onDragLeave={() => setColunaSobrevoada(prev => (prev === coluna.id ? null : prev))}
                                    onDrop={(e) => {
                                        e.preventDefault();
                                        const id = e.dataTransfer.getData('text/plain');
                                        if (id) moverPara(id, coluna.id);
                                        setArrastandoId(null);
                                        setColunaSobrevoada(null);
                                    }}
                                    className={`bg-stone-100/70 rounded-2xl p-4 border-t-4 ${coluna.accent} min-h-[200px] transition ${colunaSobrevoada === coluna.id ? 'ring-2 ring-amber-400 bg-amber-50/60' : ''}`}
                                >
                                    <div className="flex items-center justify-between mb-3 px-1">
                                        <h3 className="font-bold text-stone-800 text-xs uppercase tracking-wide">{coluna.label}</h3>
                                        <span className="text-xs font-bold px-2 py-0.5 bg-white rounded-full text-stone-500 border border-stone-200">{itens.length}</span>
                                    </div>
                                    <div className="space-y-3">
                                        {itens.length === 0 && (
                                            <p className="text-xs text-stone-400 text-center py-6">Nenhum processo aqui.</p>
                                        )}
                                        {itens.map(proc => (
                                            <div
                                                key={proc.id}
                                                draggable
                                                onDragStart={(e) => { e.dataTransfer.setData('text/plain', proc.id); setArrastandoId(proc.id); }}
                                                onDragEnd={() => { setArrastandoId(null); setColunaSobrevoada(null); }}
                                                className={`bg-white rounded-xl p-4 border border-stone-200 shadow-sm space-y-2 cursor-grab active:cursor-grabbing transition ${arrastandoId === proc.id ? 'opacity-40' : ''}`}
                                            >
                                                <div className="flex items-center justify-between gap-2 flex-wrap">
                                                    <span className="text-xs font-semibold px-2 py-0.5 bg-stone-100 text-stone-600 rounded">{proc.area}</span>
                                                    <div className="flex items-center gap-1.5">
                                                        <BadgePrazoKanban dataISO={proc.proximoPrazo} />
                                                        {proc.origem === 'tjrj' && (
                                                            <span className="text-[10px] font-bold text-indigo-600"><i className="fa-solid fa-building-columns"></i> TJRJ</span>
                                                        )}
                                                    </div>
                                                </div>
                                                <button onClick={() => onSelectProcess(proc)} className="block text-left font-mono text-xs font-semibold text-indigo-700 hover:underline">
                                                    {proc.numero}
                                                </button>
                                                <p className="text-sm font-medium text-stone-800 truncate" title={proc.clienteNome}>{proc.clienteNome}</p>
                                                <div className="flex items-center justify-between pt-2 border-t border-stone-100">
                                                    <button
                                                        onClick={() => onEditProcess(proc)}
                                                        title="Editar processo"
                                                        className="text-xs px-2 py-1 rounded text-stone-400 hover:text-amber-600 hover:bg-amber-50"
                                                    >
                                                        <i className="fa-solid fa-pen"></i>
                                                    </button>
                                                    <div className="flex items-center gap-1">
                                                        <button
                                                            disabled={colIdx === 0}
                                                            onClick={() => moverPara(proc.id, COLUNAS_KANBAN[colIdx - 1].id)}
                                                            className="text-xs px-2 py-1 rounded bg-stone-50 hover:bg-stone-100 text-stone-600 disabled:opacity-30 disabled:cursor-not-allowed"
                                                        >
                                                            <i className="fa-solid fa-arrow-left"></i>
                                                        </button>
                                                        <button
                                                            disabled={colIdx === COLUNAS_KANBAN.length - 1}
                                                            onClick={() => moverPara(proc.id, COLUNAS_KANBAN[colIdx + 1].id)}
                                                            className="text-xs px-2 py-1 rounded bg-stone-50 hover:bg-stone-100 text-stone-600 disabled:opacity-30 disabled:cursor-not-allowed"
                                                        >
                                                            <i className="fa-solid fa-arrow-right"></i>
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        const FILTROS_ALERTA = [
            { id: 'nao_tratada', label: 'Não tratadas' },
            { id: 'tratada', label: 'Tratadas' },
            { id: 'descartada', label: 'Descartadas' },
            { id: 'todos', label: 'Todos' },
        ];

        function AlertasView({ alertas, oabsMonitoradas, supabaseClient, onMergeAlertas, onAddOab, onRemoveOab, onAtualizarStatus, onImportarComoProcesso }) {
            const [filtro, setFiltro] = useState('nao_tratada');
            const [loading, setLoading] = useState(false);
            const [erro, setErro] = useState(null);
            const [aviso, setAviso] = useState(null);
            const [novaOab, setNovaOab] = useState('');
            const [novaUf, setNovaUf] = useState('RJ');
            const [expandido, setExpandido] = useState(null);

            const atualizarFeed = async () => {
                if (oabsMonitoradas.length === 0) {
                    setErro('Cadastre ao menos uma OAB para monitorar (abaixo) antes de atualizar.');
                    return;
                }
                if (!supabaseClient) {
                    setErro('Cliente Supabase não inicializado.');
                    return;
                }

                setLoading(true);
                setErro(null);
                setAviso(null);

                const avisos = [];
                let todosNovos = [];

                for (const registro of oabsMonitoradas) {
                    try {
                        const { data, error } = await invocarFunction(supabaseClient, 'busca-tjrj', {
                            body: { oab: registro.oab, uf: registro.uf },
                        });
                        if (error) throw error;
                        const comunicacoes = (data && data.comunicacoes) || [];
                        todosNovos = todosNovos.concat(comunicacoes.map(c => ({
                            ...c,
                            status: 'nao_tratada',
                            oabOrigem: registro.label,
                        })));
                        if (data && data.simulado) {
                            avisos.push(`${registro.label}: modo simulação (${data.mensagem || 'DJEN indisponível'})`);
                        }
                    } catch (err) {
                        console.error('Erro ao atualizar alertas para', registro, err);
                        avisos.push(`${registro.label}: falha ao consultar (${err.message || err})`);
                    }
                }

                onMergeAlertas(todosNovos);
                setLoading(false);
                if (avisos.length > 0) setAviso(avisos.join(' | '));
            };

            const adicionarOab = () => {
                if (!novaOab.trim()) {
                    setErro('Digite o número da OAB.');
                    return;
                }
                onAddOab(novaOab.trim(), novaUf, `OAB ${novaOab.trim()}/${novaUf}`);
                setNovaOab('');
            };

            const alertasFiltrados = filtro === 'todos' ? alertas : alertas.filter(a => a.status === filtro);

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-stone-200">
                        <div className="flex flex-wrap items-center justify-between gap-3">
                            <div>
                                <h2 className="text-2xl font-bold text-stone-900">Alertas & Publicações</h2>
                                <p className="text-stone-500 text-sm mt-1">Feed de publicações do DJEN para as OABs monitoradas. Trate ou descarte cada item.</p>
                            </div>
                            <button
                                onClick={atualizarFeed}
                                disabled={loading}
                                className="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-stone-950 font-semibold rounded-lg text-sm flex items-center gap-2 shadow-sm transition disabled:opacity-60"
                            >
                                {loading ? <><i className="fa-solid fa-spinner fa-spin"></i> Atualizando...</> : <><i className="fa-solid fa-rotate-right"></i> Atualizar Feed</>}
                            </button>
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-stone-200 p-5">
                        <h3 className="text-sm font-bold text-stone-700 mb-3">OABs monitoradas</h3>
                        <div className="flex flex-wrap gap-2 mb-4">
                            {oabsMonitoradas.length === 0 && <p className="text-xs text-stone-400">Nenhuma OAB cadastrada ainda.</p>}
                            {oabsMonitoradas.map(o => (
                                <span key={o.id} className="inline-flex items-center gap-2 px-3 py-1.5 bg-stone-100 text-stone-700 rounded-full text-xs font-medium">
                                    {o.label}
                                    <button onClick={() => onRemoveOab(o.id)} className="text-stone-400 hover:text-rose-600"><i className="fa-solid fa-xmark"></i></button>
                                </span>
                            ))}
                        </div>
                        <div className="flex gap-2">
                            <select value={novaUf} onChange={e => setNovaUf(e.target.value)} className="px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg text-sm w-24">
                                <option value="RJ">RJ</option>
                                <option value="SP">SP</option>
                            </select>
                            <input
                                type="text"
                                value={novaOab}
                                onChange={e => setNovaOab(e.target.value)}
                                onKeyDown={e => e.key === 'Enter' && adicionarOab()}
                                placeholder="Número da OAB a monitorar"
                                className="flex-1 px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg text-sm"
                            />
                            <button onClick={adicionarOab} className="px-4 py-2 bg-navy-800 hover:bg-navy-900 text-white rounded-lg text-sm font-semibold">
                                <i className="fa-solid fa-plus mr-1"></i> Adicionar
                            </button>
                        </div>
                    </div>

                    {erro && <div className="p-4 bg-rose-50 text-rose-700 rounded-xl border border-rose-200 flex items-center gap-3 text-sm"><i className="fa-solid fa-triangle-exclamation text-lg"></i> {erro}</div>}
                    {aviso && <div className="p-4 bg-amber-50 text-amber-800 rounded-xl border border-amber-200 flex items-center gap-3 text-sm"><i className="fa-solid fa-circle-info text-lg"></i> {aviso}</div>}

                    <div className="flex gap-2 flex-wrap">
                        {FILTROS_ALERTA.map(f => (
                            <button
                                key={f.id}
                                onClick={() => setFiltro(f.id)}
                                className={`px-4 py-1.5 rounded-full text-xs font-semibold transition ${filtro === f.id ? 'bg-navy-900 text-white' : 'bg-white text-stone-600 border border-stone-200 hover:bg-stone-50'}`}
                            >
                                {f.label} {f.id !== 'todos' && `(${alertas.filter(a => a.status === f.id).length})`}
                            </button>
                        ))}
                    </div>

                    <div className="space-y-3">
                        {alertasFiltrados.length === 0 && (
                            <div className="bg-white p-10 rounded-2xl border border-stone-200 text-center text-stone-400">
                                <i className="fa-solid fa-inbox text-3xl mb-3"></i>
                                <p>Nenhum alerta {filtro !== 'todos' ? `"${FILTROS_ALERTA.find(f => f.id === filtro)?.label.toLowerCase()}"` : ''} no momento.</p>
                            </div>
                        )}
                        {alertasFiltrados.map(a => (
                            <div key={a.id} className="bg-white rounded-xl border border-stone-200 shadow-sm p-4">
                                <div className="flex flex-wrap items-start justify-between gap-3">
                                    <div className="space-y-1 flex-1 min-w-0">
                                        <div className="flex items-center gap-2 flex-wrap">
                                            <span className="text-xs font-bold px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded">{a.tipo}</span>
                                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded uppercase ${a.status === 'nao_tratada' ? 'bg-amber-100 text-amber-700' : a.status === 'tratada' ? 'bg-emerald-100 text-emerald-700' : 'bg-stone-100 text-stone-500'}`}>
                                                {a.status.replace('_', ' ')}
                                            </span>
                                            <span className="text-xs text-stone-400 font-mono">{a.numero}</span>
                                            {a.oabOrigem && <span className="text-xs text-stone-400">• {a.oabOrigem}</span>}
                                        </div>
                                        <p className="text-sm text-stone-800 font-medium">{a.poloAtivo}</p>
                                        <p className={`text-xs text-stone-500 ${expandido === a.id ? '' : 'line-clamp-2'}`}>{a.texto}</p>
                                        <button onClick={() => setExpandido(expandido === a.id ? null : a.id)} className="text-xs text-indigo-600 hover:underline">
                                            {expandido === a.id ? 'Ver menos' : 'Ver mais'}
                                        </button>
                                        <p className="text-xs text-stone-400">{a.orgaoJulgador} {a.data ? `• ${new Date(a.data + 'T00:00:00').toLocaleDateString('pt-BR')}` : ''}</p>
                                    </div>
                                    <div className="flex flex-col gap-2 items-end">
                                        {a.status === 'nao_tratada' && (
                                            <>
                                                <button onClick={() => onImportarComoProcesso(a)} className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg whitespace-nowrap">
                                                    <i className="fa-solid fa-download mr-1"></i> Tratar e importar
                                                </button>
                                                <button onClick={() => onAtualizarStatus(a.id, 'descartada')} className="px-3 py-1.5 bg-stone-100 hover:bg-stone-200 text-stone-600 text-xs font-medium rounded-lg whitespace-nowrap">
                                                    Descartar
                                                </button>
                                            </>

        // Gera o texto de uma minuta a partir de cliente + (opcionalmente) processo +
        // dados do advogado logado. Compartilhado entre o Gerador de Documentos (visão
        // geral) e o painel embutido em cada processo — ambos chamam a mesma função,
        // só muda de onde vêm currentClient/currentProcess.
        // Substitui placeholders tipo {{cliente.nome}} / {{processo.numero}} num modelo
        // de documento próprio do usuário. Placeholder sem valor disponível fica como
        // está (mais fácil de notar e preencher manualmente do que sumir sem avisar).
        function substituirPlaceholders(texto, dados) {
            return (texto || '').replace(/\{\{\s*([\w.]+)\s*\}\}/g, (match, caminho) => {
                const valor = caminho.split('.').reduce((obj, chave) => (obj != null ? obj[chave] : undefined), dados);
                return (valor !== undefined && valor !== null && valor !== '') ? String(valor) : match;
            });
        }

        function ModeloDocumentoModal({ modelo, conteudoInicial, supabaseClient, onClose, onSave }) {
            const [nome, setNome] = useState(modelo?.nome || '');
            const [conteudo, setConteudo] = useState(modelo?.conteudo || conteudoInicial || '');
            const [gerandoIA, setGerandoIA] = useState(false);
            const [descricaoIA, setDescricaoIA] = useState('');
            const [importando, setImportando] = useState(false);
            const [erro, setErro] = useState('');

            const criarComIA = async () => {
                if (!descricaoIA.trim()) { setErro('Descreva o modelo que você quer.'); return; }
                setGerandoIA(true);
                setErro('');
                try {
                    const { apiKey, provedor } = await resolverProvedorIA();
                    const { data, error } = await invocarFunction(supabaseClient, 'criar-peca-ia', {
                        body: { tarefa: 'modelo_documento', contexto: { instrucoes: descricaoIA }, apiKey: apiKey || undefined, provedor: provedor || undefined },
                    });
                    if (error) throw error;
                    if (data && data.error) { setErro(data.error); return; }
                    setConteudo(data.texto || '');
                } catch (e) {
                    setErro(e.message || 'Falha ao gerar com IA.');
                } finally {
                    setGerandoIA(false);
                }
            };

            const importarArquivo = async (e) => {
                const arquivo = e.target.files?.[0];
                if (!arquivo) return;
                setImportando(true);
                setErro('');
                try {
                    let texto = '';
                    if (/\.docx$/i.test(arquivo.name)) {
                        if (!window.mammoth) throw new Error('Biblioteca de leitura de .docx não carregou.');
                        const buffer = await arquivo.arrayBuffer();
                        const resultado = await window.mammoth.extractRawText({ arrayBuffer: buffer });
                        texto = resultado.value || '';
                    } else {
                        texto = await arquivo.text();
                    }
                    setConteudo(texto);
                    if (!nome.trim()) setNome(arquivo.name.replace(/\.(docx|txt)$/i, ''));
                } catch (err) {
                    setErro('Não foi possível ler o arquivo. Tente um .docx ou .txt.');
                } finally {
                    setImportando(false);
                    e.target.value = '';
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!nome.trim() || !conteudo.trim()) { setErro('Preencha nome e conteúdo do modelo.'); return; }
                onSave({ ...(modelo || {}), nome: nome.trim(), conteudo });
            };

            return (
                <div className="fixed inset-0 bg-navy-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                        <div className="flex justify-between items-center border-b pb-3">
                            <h3 className="font-bold text-lg text-stone-900">{modelo ? 'Editar Modelo' : 'Novo Modelo de Documento'}</h3>
                            <button onClick={onClose} className="text-stone-400 hover:text-stone-600"><i className="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <p className="text-xs text-stone-500">
                            Use placeholders como <code className="bg-stone-100 px-1 rounded">{'{{cliente.nome}}'}</code>, <code className="bg-stone-100 px-1 rounded">{'{{processo.numero}}'}</code>, <code className="bg-stone-100 px-1 rounded">{'{{advogado.nome}}'}</code>, <code className="bg-stone-100 px-1 rounded">{'{{advogado.oab}}'}</code>, <code className="bg-stone-100 px-1 rounded">{'{{data}}'}</code> — são preenchidos automaticamente na hora de gerar.
                        </p>

                        {erro && <div className="p-3 bg-rose-50 text-rose-700 rounded-xl border border-rose-200 text-xs">{erro}</div>}

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div className="p-3 bg-stone-50 border border-stone-200 rounded-xl space-y-2">
                                <label className="block text-xs font-semibold text-stone-600">Importar arquivo (.docx ou .txt)</label>
                                <input type="file" accept=".docx,.txt" onChange={importarArquivo} disabled={importando} className="text-xs w-full" />

                            </div>
                            <div className="p-3 bg-stone-50 border border-stone-200 rounded-xl space-y-2">
                                <label className="block text-xs font-semibold text-stone-600">Criar com IA</label>
                                <div className="flex gap-1.5">
                                    <input value={descricaoIA} onChange={e => setDescricaoIA(e.target.value)} placeholder="Ex: notificação de atraso de aluguel" className="flex-1 p-1.5 bg-white border border-stone-200 rounded-lg text-xs" />
                                    <button type="button" onClick={criarComIA} disabled={gerandoIA} className="px-2.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold disabled:opacity-60">
                                        {gerandoIA ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-wand-magic-sparkles"></i>}
                                    </button>
                                </div>
                            </div>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-3">
                            <div>
                                <label className="block text-xs font-semibold text-stone-600 mb-1">Nome do modelo *</label>
                                <input required value={nome} onChange={e => setNome(e.target.value)} placeholder="Ex: Notificação de Atraso" className="w-full p-2 bg-stone-50 border border-stone-200 rounded-lg text-sm" />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-stone-600 mb-1">Conteúdo *</label>
                                <textarea required value={conteudo} onChange={e => setConteudo(e.target.value)} rows={10} className="w-full p-2 bg-stone-50 border border-stone-200 rounded-lg text-sm font-mono" />
                            </div>
                            <div className="flex justify-end gap-2 pt-2 border-t">
                                <button type="button" onClick={onClose} className="px-4 py-2 bg-stone-100 text-stone-700 text-xs font-semibold rounded-lg">Cancelar</button>
                                <button type="submit" className="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-stone-950 font-bold rounded-lg text-sm">Salvar Modelo</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function gerarTextoDocumento({ template, currentClient, currentProcess, advogadoNome, advogadoOab, valorRecibo, assuntoNotificacao }) {
            if (!currentClient) return 'Cadastre ao menos um cliente para gerar documentos.';
            const dataExtenso = new Date().toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' });
            const referenciaProcesso = currentProcess
                ? `\n\nREFERENTE AO PROCESSO Nº ${currentProcess.numero}, em trâmite perante ${currentProcess.vara || 'o juízo competente'}.`
                : '';

            if (template === 'procuracao') {
                return `PROCURAÇÃO AD JUDICIA ET EXTRA

OUTORGANTE: ${currentClient.nome.toUpperCase()}, ${currentClient.tipo === 'PF' ? `portador(a) do CPF nº ${currentClient.documento}, residente e domiciliado(a) na ${currentClient.endereco}, ${currentClient.cidade}/${currentClient.uf}` : `pessoa jurídica de direito privado inscrita no CNPJ sob o nº ${currentClient.documento}, com sede na ${currentClient.endereco}, ${currentClient.cidade}/${currentClient.uf}`}.

OUTORGADO: ${advogadoNome.toUpperCase()}, inscrito(a) na OAB sob o nº ${advogadoOab}.

PODERES: Pelo presente instrumento, o(a) Outorgante concede ao Outorgado amplos poderes para o foro em geral, conferindo-lhe os da cláusula "ad judicia et extra", em qualquer Juízo, Tribunal ou Ordem Administrativa, podendo propor contra quem de direito as ações competentes e defendê-lo(a) nas contrárias, confessar, reconhecer a procedência do pedido, transigir, desistir, renunciar ao direito sobre o qual se funda a ação, receber, dar quitação e firmar compromissos.${referenciaProcesso}

${currentClient.cidade}/${currentClient.uf}, ${dataExtenso}.


________________________________________________________
${currentClient.nome.toUpperCase()}
Outorgante`;
            }

            if (template === 'contrato_honorarios') {
                return `CONTRATO DE PRESTAÇÃO DE SERVIÇOS ADVOCATÍCIOS E HONORÁRIOS

CONTRATANTE: ${currentClient.nome}, inscrito(a) sob o Doc nº ${currentClient.documento}, com endereço na ${currentClient.endereco}, ${currentClient.cidade}/${currentClient.uf}.

CONTRATADO: ${advogadoNome}, OAB nº ${advogadoOab}.

CLÁUSULA PRIMEIRA - DO OBJETO
O CONTRATADO compromete-se a prestar assistência jurídica ao CONTRATANTE para propositura e acompanhamento de ação judicial pertinente à defesa de seus interesses.${referenciaProcesso}

CLÁUSULA SEGUNDA - DOS HONORÁRIOS
Pelos serviços prestados, o CONTRATANTE pagará ao CONTRATADO o valor fixo pactuado, além do percentual de 20% (vinte por cento) sobre o êxito econômico alcançado ao final do processo.

CLÁUSULA TERCEIRA - DO FORO
Para dirimir quaisquer dúvidas oriundas deste contrato, as partes elegem o foro da Comarca de ${currentClient.cidade}/${currentClient.uf}.

${currentClient.cidade}/${currentClient.uf}, ${dataExtenso}.


________________________________________         ________________________________________
CONTRATANTE                                      CONTRATADO`;
            }

            if (template === 'recibo_honorarios') {
                return `RECIBO DE HONORÁRIOS ADVOCATÍCIOS

Recebi de ${currentClient.nome}, ${currentClient.tipo === 'PF' ? `CPF nº ${currentClient.documento}` : `CNPJ nº ${currentClient.documento}`}, a importância de ${valorRecibo ? `R$ ${valorRecibo}` : '[VALOR A PREENCHER]'}, referente a honorários advocatícios${currentProcess ? ` do processo nº ${currentProcess.numero}` : ''}, para os devidos fins e efeitos de direito.

${currentClient.cidade}/${currentClient.uf}, ${dataExtenso}.


________________________________________________________
${advogadoNome.toUpperCase()}
OAB nº ${advogadoOab}`;
            }

            if (template === 'notificacao_extrajudicial') {
                return `NOTIFICAÇÃO EXTRAJUDICIAL

AO(À): ${currentClient.nome.toUpperCase()}
${currentClient.endereco || ''}, ${currentClient.cidade}/${currentClient.uf}

Pela presente, vimos notificá-lo(a) para que, no prazo de 10 (dez) dias a contar do recebimento desta, regularize a situação relativa a: ${assuntoNotificacao || '[DESCREVER O ASSUNTO DA NOTIFICAÇÃO]'}.${referenciaProcesso}

O não atendimento desta notificação no prazo estipulado ensejará a adoção das medidas judiciais cabíveis, sem prejuízo de outras sanções previstas em lei ou contrato.

${currentClient.cidade}/${currentClient.uf}, ${dataExtenso}.


________________________________________________________
${advogadoNome.toUpperCase()}
OAB nº ${advogadoOab}`;
            }

            return '';
        }

        function DocumentGeneratorView({ clients, processes, session, processoFixo, modelosDocumento, onSalvarModelo, supabaseClient }) {
            const [selectedTemplate, setSelectedTemplate] = useState('procuracao');
            const [selectedClientId, setSelectedClientId] = useState(processoFixo?.clienteId || clients[0]?.id || '');
            const [selectedProcessId, setSelectedProcessId] = useState(processoFixo?.id || '');
            const [valorRecibo, setValorRecibo] = useState('');
            const [assuntoNotificacao, setAssuntoNotificacao] = useState('');
            const [gerenciarModelos, setGerenciarModelos] = useState(false);
            const [editandoModelo, setEditandoModelo] = useState(null);
            const [salvarPreviewComoModelo, setSalvarPreviewComoModelo] = useState(false);

            // Conteúdo do preview: null enquanto não houver edição manual/IA (usa o
            // texto gerado automaticamente); vira string assim que o usuário edita
            // diretamente na tela ou pede um ajuste pra IA — nesse ponto o preview
            // passa a ser "dono" do texto até o usuário trocar modelo/cliente/processo.
            const [textoEditado, setTextoEditado] = useState(null);
            const [editandoConteudo, setEditandoConteudo] = useState(false);
            const [instrucaoIA, setInstrucaoIA] = useState('');
            const [melhorandoIA, setMelhorandoIA] = useState(false);
            const [erroMelhoriaIA, setErroMelhoriaIA] = useState('');

            const currentClient = clients.find(c => c.id === selectedClientId) || clients[0];
            const currentProcess = processoFixo || processes.find(p => p.id === selectedProcessId) || null;
            const advogadoNome = session?.user?.user_metadata?.nome || 'DR(A). ADVOGADO(A) AUTÔNOMO(A)';
            const advogadoOab = session?.user?.user_metadata?.oab || '000.000';
            const modeloProprioSelecionado = selectedTemplate.startsWith('custom:')
                ? (modelosDocumento || []).find(m => `custom:${m.id}` === selectedTemplate)
                : null;

            const generateText = () => {
                if (modeloProprioSelecionado) {
                    return substituirPlaceholders(modeloProprioSelecionado.conteudo, {
                        cliente: currentClient || {},
                        processo: currentProcess || {},
                        advogado: { nome: advogadoNome, oab: advogadoOab },
                        data: new Date().toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' }),
                    });
                }
                return gerarTextoDocumento({
                    template: selectedTemplate, currentClient, currentProcess, advogadoNome, advogadoOab, valorRecibo, assuntoNotificacao,
                });
            };

            // Sempre que o modelo/cliente/processo muda, volta a mostrar o texto
            // gerado automaticamente (descarta edição manual/IA anterior).
            useEffect(() => {
                setTextoEditado(null);
                setEditandoConteudo(false);
            }, [selectedTemplate, selectedClientId, selectedProcessId]);

            const textoAtual = textoEditado !== null ? textoEditado : generateText();

            const melhorarComIA = async () => {
                if (!instrucaoIA.trim()) { setErroMelhoriaIA('Descreva o que ajustar no texto.'); return; }
                setMelhorandoIA(true);
                setErroMelhoriaIA('');
                try {
                    const { apiKey, provedor } = await resolverProvedorIA();
                    const { data, error } = await invocarFunction(supabaseClient, 'criar-peca-ia', {
                        body: {
                            tarefa: 'revisar_texto',
                            contexto: { instrucoes: instrucaoIA.trim(), textoAtual, cliente: currentClient || {}, processo: currentProcess || {} },
                            apiKey: apiKey || undefined, provedor: provedor || undefined,
                        },
                    });
                    if (error) throw error;
                    if (data && data.error) { setErroMelhoriaIA(data.error); return; }
                    setTextoEditado(data.texto || textoAtual);
                    setEditandoConteudo(true);
                    setInstrucaoIA('');
                } catch (e) {
                    setErroMelhoriaIA(e.message || 'Falha ao consultar a IA.');
                } finally {
                    setMelhorandoIA(false);
                }
            };

            const copyToClipboard = () => {
                const textArea = document.createElement('textarea');
                textArea.value = textoAtual;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('Documento copiado para a área de transferência!');
            };

            const handlePrint = () => {
                window.print();
            };

            const handleDownloadWord = () => {
                const nomeBase = modeloProprioSelecionado ? modeloProprioSelecionado.nome : selectedTemplate;
                const nomeArquivo = `${nomeBase}-${(currentClient?.nome || 'documento').replace(/[^\wÀ-ÿ]+/g, '-')}`;
                baixarComoWord(textoAtual, nomeArquivo);
            };

            return (
                <div className="space-y-6">
                    {!processoFixo && (
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-stone-200">
                            <h2 className="text-2xl font-bold text-stone-900">Gerador Automático de Documentos</h2>
                            <p className="text-stone-500 text-sm mt-1">Preenchimento automático de minuta jurídica com dados reais do cliente (e, se quiser, do processo) cadastrados.</p>
                        </div>
                    )}

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* Controles do Gerador */}
                        <div className="bg-white p-5 rounded-2xl border border-stone-200 shadow-sm space-y-4">
                            <h3 className="font-bold text-stone-900 text-base">Parâmetros do Documento</h3>

                            <div>
                                <div className="flex items-center justify-between mb-1">
                                    <label className="block text-xs font-semibold text-stone-600">Modelo de Minuta</label>
                                    <button type="button" onClick={() => { setEditandoModelo(null); setGerenciarModelos(true); }} className="text-[11px] font-semibold text-indigo-600 hover:text-indigo-800">
                                        <i className="fa-solid fa-gear mr-1"></i>Meus Modelos
                                    </button>
                                </div>
                                <select
                                    value={selectedTemplate}
                                    onChange={(e) => setSelectedTemplate(e.target.value)}
                                    className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                >
                                    <optgroup label="Modelos do JurisControl">
                                        {TEMPLATES_DOCUMENTO.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
                                    </optgroup>
                                    {(modelosDocumento || []).length > 0 && (
                                        <optgroup label="Meus Modelos">
                                            {modelosDocumento.map(m => <option key={m.id} value={`custom:${m.id}`}>{m.nome}</option>)}
                                        </optgroup>
                                    )}
                                </select>
                                {modeloProprioSelecionado && (
                                    <button type="button" onClick={() => { setEditandoModelo(modeloProprioSelecionado); setGerenciarModelos(true); }} className="text-[11px] text-stone-400 hover:text-indigo-600 mt-1">
                                        <i className="fa-solid fa-pen mr-1"></i>Editar este modelo
                                    </button>
                                )}
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-stone-600 mb-1">Selecionar Cliente (CRM)</label>
                                <select
                                    value={selectedClientId}
                                    onChange={(e) => setSelectedClientId(e.target.value)}
                                    className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                >
                                    {clients.map(c => (
                                        <option key={c.id} value={c.id}>{c.nome} ({c.documento})</option>
                                    ))}
                                </select>
                            </div>

                            {!processoFixo && (
                                <div>
                                    <label className="block text-xs font-semibold text-stone-600 mb-1">Processo relacionado (opcional)</label>
                                    <select
                                        value={selectedProcessId}
                                        onChange={(e) => setSelectedProcessId(e.target.value)}
                                        className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                    >
                                        <option value="">Nenhum (documento avulso)</option>
                                        {processes.map(p => (
                                            <option key={p.id} value={p.id}>{p.numero} — {p.clienteNome}</option>
                                        ))}
                                    </select>
                                </div>
                            )}

                            {selectedTemplate === 'recibo_honorarios' && (
                                <div>
                                    <label className="block text-xs font-semibold text-stone-600 mb-1">Valor recebido (R$)</label>
                                    <input type="text" value={valorRecibo} onChange={e => setValorRecibo(e.target.value)} placeholder="3.500,00" className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm" />
                                </div>
                            )}
                            {selectedTemplate === 'notificacao_extrajudicial' && (
                                <div>
                                    <label className="block text-xs font-semibold text-stone-600 mb-1">Assunto da notificação</label>
                                    <input type="text" value={assuntoNotificacao} onChange={e => setAssuntoNotificacao(e.target.value)} placeholder="Ex: inadimplência de aluguel" className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm" />
                                </div>
                            )}

                            <div className="pt-4 border-t border-stone-100 flex flex-col gap-2">
                                <button
                                    onClick={handleDownloadWord}
                                    className="w-full py-2.5 bg-navy-700 hover:bg-navy-800 text-white font-medium rounded-xl text-sm flex items-center justify-center gap-2 transition"
                                >
                                    <i className="fa-solid fa-file-word"></i> Baixar em Word (.docx)
                                </button>
                                <button
                                    onClick={copyToClipboard}
                                    className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl text-sm flex items-center justify-center gap-2 transition"
                                >
                                    <i className="fa-solid fa-copy"></i> Copiar Texto
                                </button>
                                <button
                                    onClick={handlePrint}
                                    className="w-full py-2.5 bg-stone-100 hover:bg-stone-200 text-stone-800 font-medium rounded-xl text-sm flex items-center justify-center gap-2 transition"
                                >
                                    <i className="fa-solid fa-print"></i> Imprimir / Salvar PDF
                                </button>
                                <button
                                    onClick={() => { setEditandoModelo(null); setSalvarPreviewComoModelo(true); setGerenciarModelos(true); }}
                                    className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-xl text-sm flex items-center justify-center gap-2 transition"
                                >
                                    <i className="fa-solid fa-floppy-disk"></i> Salvar como Meu Modelo
                                </button>
                            </div>
                        </div>

                        {/* Visualizador / Preview */}
                        <div className="lg:col-span-2 bg-white rounded-2xl border border-stone-200 shadow-sm border-l-4 border-l-amber-500 flex flex-col overflow-hidden">
                            <div className="p-3 border-b border-stone-100 flex items-center justify-between gap-2 flex-wrap bg-stone-50/60">
                                <span className="text-xs font-semibold text-stone-500">
                                    {editandoConteudo ? 'Editando o conteúdo diretamente' : 'Pré-visualização'}
                                    {textoEditado !== null && !editandoConteudo && ' (ajustado)'}
                                </span>
                                <button
                                    type="button"
                                    onClick={() => setEditandoConteudo(v => !v)}
                                    className="text-xs font-semibold text-indigo-600 hover:text-indigo-800"
                                >
                                    <i className={`fa-solid ${editandoConteudo ? 'fa-eye' : 'fa-pen'} mr-1`}></i>
                                    {editandoConteudo ? 'Ver como ficaria' : 'Editar conteúdo'}
                                </button>
                            </div>

                            <div className="p-3 border-b border-stone-100 bg-stone-50/60 space-y-2">
                                {erroMelhoriaIA && <p className="text-xs text-rose-600">{erroMelhoriaIA}</p>}
                                <div className="flex gap-2">
                                    <input
                                        type="text"
                                        value={instrucaoIA}
                                        onChange={e => setInstrucaoIA(e.target.value)}
                                        placeholder="Peça um ajuste pra IA: ex. 'deixe o tom mais formal' ou 'inclua cláusula de foro'"
                                        className="flex-1 p-2 bg-white border border-stone-200 rounded-lg text-xs"
                                    />
                                    <button
                                        type="button"
                                        onClick={melhorarComIA}
                                        disabled={melhorandoIA}
                                        className="px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold flex items-center gap-1.5 disabled:opacity-60 whitespace-nowrap"
                                    >
                                        {melhorandoIA ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-wand-magic-sparkles"></i>} Melhorar com IA
                                    </button>
                                </div>
                            </div>

                            {editandoConteudo ? (
                                <textarea
                                    value={textoAtual}
                                    onChange={e => setTextoEditado(e.target.value)}
                                    className="flex-1 p-8 text-stone-800 leading-relaxed resize-none focus:outline-none min-h-[420px]"
                                />
                            ) : (
                                <div className="flex-1 p-8 text-stone-800 whitespace-pre-line leading-relaxed">
                                    {textoAtual}
                                </div>
                            )}
                        </div>
                    </div>

                    {gerenciarModelos && (
                        <ModeloDocumentoModal
                            modelo={editandoModelo}
                            conteudoInicial={salvarPreviewComoModelo ? textoAtual : undefined}
                            supabaseClient={supabaseClient}
                            onClose={() => { setGerenciarModelos(false); setSalvarPreviewComoModelo(false); }}
                            onSave={(dados) => {
                                const salvo = onSalvarModelo(dados);
                                setGerenciarModelos(false);
                                setSalvarPreviewComoModelo(false);
                                if (salvo?.id) setSelectedTemplate(`custom:${salvo.id}`);
                            }}
                        />
                    )}
                </div>
            );
        }

        const TIPOS_PECA_IA = [
            "Petição Inicial",
            "Contestação",
            "Réplica",
            "Recurso de Apelação",
            "Recurso Especial",
            "Parecer Jurídico",
            "Notificação Extrajudicial",
            "Contrato de Honorários Advocatícios",
            "Procuração Ad Judicia Et Extra",
            "Outro (descrever nas instruções)",
        ];

        // Escolhe qual provedor/chave usar numa chamada de IA: prioriza uma chave
        // Anthropic conectada pelo usuário, depois ChatGPT, depois Gemini, e só
        // por último cai pro plano gratuito (sem apiKey — a function usa o Gemini
        // da casa e conta na cota mensal). Gemini fica por último de propósito —
        // é o único provedor com plano gratuito, os outros dois são BYOK puro.
        async function resolverProvedorIA() {
            const [chaveClaude, chaveOpenai, chaveGemini] = await Promise.all([
                getSecret('ANTHROPIC_API_KEY'), getSecret('OPENAI_API_KEY'), getSecret('GEMINI_API_KEY'),
            ]);
            if (chaveClaude) return { apiKey: chaveClaude, provedor: 'anthropic' };
            if (chaveOpenai) return { apiKey: chaveOpenai, provedor: 'openai' };
            if (chaveGemini) return { apiKey: chaveGemini, provedor: 'gemini' };
            return { apiKey: null, provedor: null };
        }

        // Mostra quantas gerações gratuitas já foram usadas este mês, ou avisa que o
        // uso é ilimitado quando há uma chave própria conectada. Consulta
        // uso_ia_gratuita direto (a tabela tem uma policy de leitura só da própria
        // linha), sem precisar chamar nenhuma function.
        function UsoIAGratuitaBanner({ supabaseClient, session }) {
            const [estado, setEstado] = useState(null);

            useEffect(() => {
                let cancelado = false;
                (async () => {
                    const { apiKey } = await resolverProvedorIA();
                    if (apiKey) {
                        if (!cancelado) setEstado({ temChavePropria: true });
                        return;
                    }
                    const mes = new Date().toISOString().slice(0, 7);
                    const { data } = await supabaseClient
                        .from('uso_ia_gratuita').select('contagem')
                        .eq('user_id', session.user.id).eq('mes', mes).maybeSingle();
                    if (!cancelado) setEstado({ temChavePropria: false, usadas: data?.contagem ?? 0 });
                })();
                return () => { cancelado = true; };
            }, [session.user.id]);

            if (!estado) return null;
            if (estado.temChavePropria) {
                return (
                    <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-xs text-emerald-800 flex items-center gap-2">

                setErro(null);
                setResultado(null);

                const clienteSelecionado = clients.find(c => c.id === clienteId);
                const processoSelecionado = processes.find(p => p.id === processoId);
                const { apiKey, provedor } = await resolverProvedorIA();

                try {
                    const { data, error } = await invocarFunction(supabaseClient, 'criar-peca-ia', {
                        body: {
                            tarefa: 'minuta',
                            contexto: {
                                tipoPeca,
                                instrucoes,
                                cliente: clienteSelecionado || undefined,
                                processo: processoSelecionado || undefined,
                            },
                            apiKey: apiKey || undefined,
                            provedor: provedor || undefined,
                        },
                    });

                    if (error) throw error;
                    if (data && data.error) {
                        setErro(data.error);
                        return;
                    }

                    setResultado(data);
                    setAtualizacoesUso(n => n + 1);

        function DeadlineCalculatorView({ supabaseClient }) {
            const [startDate, setStartDate] = useState(new Date().toISOString().split('T')[0]);
            const [daysCount, setDaysCount] = useState(15);
            const [finalDate, setFinalDate] = useState(null);
            const [situacaoIA, setSituacaoIA] = useState('');
            const [respostaIA, setRespostaIA] = useState('');
            const [erroIA, setErroIA] = useState('');
            const [carregandoIA, setCarregandoIA] = useState(false);

            const perguntarIA = async () => {
                if (!situacaoIA.trim()) { setErroIA('Descreva a situação primeiro.'); return; }
                setCarregandoIA(true);
                setErroIA('');
                setRespostaIA('');
                try {
                    const { apiKey, provedor } = await resolverProvedorIA();
                    const { data, error } = await invocarFunction(supabaseClient, 'criar-peca-ia', {
                        body: { tarefa: 'sugestao_prazo', contexto: { instrucoes: situacaoIA }, apiKey: apiKey || undefined, provedor: provedor || undefined },
                    });
                    if (error) throw error;
                    if (data && data.error) { setErroIA(data.error); return; }
                    setRespostaIA(data.texto || '');
                } catch (e) {
                    setErroIA(e.message || 'Falha ao consultar a IA.');
                } finally {
                    setCarregandoIA(false);
                }
            };

            const calculateCPCDeadline = () => {
                let current = new Date(startDate + 'T00:00:00');
                let addedDays = 0;

                // Avança para o próximo dia útil inicial
                current.setDate(current.getDate() + 1);

                while (addedDays < daysCount) {
                    const dayOfWeek = current.getDay();
                    // 0 = Domingo, 6 = Sábado
                    if (dayOfWeek !== 0 && dayOfWeek !== 6) {
                        addedDays++;
                    }
                    if (addedDays < daysCount) {
                        current.setDate(current.getDate() + 1);
                    }
                }

                setFinalDate(current);
            };

            useEffect(() => {
                calculateCPCDeadline();
            }, [startDate, daysCount]);

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-stone-200">
                        <h2 className="text-2xl font-bold text-stone-900">Calculadora de Prazos (CPC - Dias Úteis)</h2>
                        <p className="text-stone-500 text-sm mt-1">Simulação de contagem conforme Art. 219 do Código de Processo Civil (exclui finais de semana).</p>
                    </div>

                        <div className="bg-white p-6 rounded-2xl border border-stone-200 shadow-sm space-y-4">

                                <label className="block text-xs font-semibold text-stone-700 mb-1">Data da Intimação / Publicação</label>
                                <input
                                    type="date"
                                    value={startDate}
                                    onChange={(e) => setStartDate(e.target.value)}
                                    className="w-full p-2.5 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                />
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-stone-700 mb-1">Quantidade de Dias (Úteis)</label>
                                <input
                                    type="number"
                                    value={daysCount}
                                    onChange={(e) => setDaysCount(Number(e.target.value))}
                                    className="w-full p-2.5 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                />
                            </div>

                            <div className="p-4 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-800">
                                <strong>Nota legal:</strong> A contagem inicia-se no primeiro dia útil subsequente à publicação. Não considera feriados locais customizados.
                            </div>
                        </div>

                        <div className="bg-gradient-to-br from-navy-900 to-navy-800 text-white p-6 rounded-2xl flex flex-col justify-between shadow-md">
                            <div>
                                <span className="text-xs uppercase tracking-widest text-amber-400 font-semibold">Resultado Estimado</span>
                                <h3 className="text-xl font-bold mt-2">Data Fatal do Prazo:</h3>
                                <div className="text-3xl md:text-4xl font-extrabold text-amber-400 mt-4">
                                    {finalDate ? finalDate.toLocaleDateString('pt-BR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) : '---'}
                                </div>
                            </div>
                            <div className="text-xs text-stone-400 border-t border-stone-700 pt-4 mt-6">
                                Sempre confira eventuais portarias de suspensão de expediente do Tribunal competente.
                            </div>
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-2xl border border-stone-200 shadow-sm space-y-3">
                        <h3 className="font-bold text-stone-900 text-sm flex items-center gap-2">
                            <i className="fa-solid fa-wand-magic-sparkles text-indigo-500"></i> Perguntar pra IA (opcional)
                        </h3>

                            />
                            <button
                                onClick={perguntarIA}

                            >
                                {carregandoIA ? <i className="fa-solid fa-spinner fa-spin"></i> : 'Perguntar'}
                            </button>
                        </div>
                        {erroIA && <p className="text-xs text-rose-600">{erroIA}</p>}
                        {respostaIA && (

                    </div>
                </div>

        }
