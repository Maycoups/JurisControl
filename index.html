        // Painel de IA embutido nos detalhes do processo (resumo / próximo passo / minuta
        // rápida) — reaproveita a mesma Edge Function "criar-peca-ia" da aba Criação de
        // Peças (IA), agora com contrato unificado { tarefa, contexto, apiKey }.
        function AiAssistPanel({ process, supabaseClient }) {
            const [tipoPeca, setTipoPeca] = useState(TIPOS_PECA_IA[0]);
            const [instrucoes, setInstrucoes] = useState('');
            const [resultado, setResultado] = useState('');
            const [erro, setErro] = useState('');
            const [carregando, setCarregando] = useState(''); // '' | 'minuta' | 'resumo' | 'proximo_passo'
            const [copiado, setCopiado] = useState(false);

            const executar = async (tarefa, extra) => {
                if (!supabaseClient) { setErro('Cliente Supabase não inicializado.'); return; }
                setCarregando(tarefa);
                setErro('');
                setCopiado(false);
                try {
                    const { apiKey, provedor } = await resolverProvedorIA();
                    const { data, error } = await invocarFunction(supabaseClient, 'criar-peca-ia', {
                        body: { tarefa, contexto: { processo: process, ...extra }, apiKey: apiKey || undefined, provedor: provedor || undefined },
                    });
                    if (error) throw error;
                    if (data && data.error) { setErro(data.error); return; }
                    setResultado((data && data.texto) || '');
                } catch (e) {
                    setErro(e.message || 'Falha ao chamar o assistente de IA.');
                } finally {
                    setCarregando('');
                }
            };

            const handleCopiar = () => {
                navigator.clipboard.writeText(resultado).then(() => {
                    setCopiado(true);
                    setTimeout(() => setCopiado(false), 2000);
                });
            };

            const handleBaixarTxt = () => {
                const slug = (tipoPeca || 'documento').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
                const blob = new Blob([resultado], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `minuta-${slug}-${Date.now()}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            return (
                <div className="space-y-3">
                    <h4 className="text-xs font-bold text-stone-700 uppercase flex items-center gap-2">
                        <i className="fa-solid fa-wand-magic-sparkles text-indigo-500"></i> Assistente de IA
                    </h4>

                    <div className="space-y-2">
                        <div className="flex flex-col sm:flex-row gap-2">
                            <select
                                className="flex-1 p-2 bg-stone-50 border rounded-lg text-xs"
                                value={tipoPeca}
                                onChange={e => setTipoPeca(e.target.value)}
                            >
                                {TIPOS_PECA_IA.map(t => <option key={t} value={t}>{t}</option>)}
                            </select>
                            <button
                                onClick={() => executar('minuta', { tipoPeca, instrucoes })}
                                disabled={!!carregando}
                                className="px-3 py-2 bg-amber-500 hover:bg-amber-600 disabled:opacity-60 text-stone-950 text-xs font-bold rounded-lg shadow-sm whitespace-nowrap"
                            >
                                {carregando === 'minuta' ? 'Gerando...' : 'Gerar Minuta'}
                            </button>
                        </div>
                        <textarea
                            placeholder="Instruções adicionais para a minuta (opcional)"
                            className="w-full p-2 bg-stone-50 border rounded-lg text-xs"
                            rows="2"
                            value={instrucoes}
                            onChange={e => setInstrucoes(e.target.value)}
                        />
                        <div className="flex flex-wrap gap-2">
                            <button
                                onClick={() => executar('resumo', {})}
                                disabled={!!carregando}
                                className="px-3 py-2 bg-navy-700 hover:bg-navy-800 disabled:opacity-60 text-white text-xs font-bold rounded-lg shadow-sm"
                            >
                                {carregando === 'resumo' ? 'Resumindo...' : 'Resumir Processo'}
                            </button>
                            <button
                                onClick={() => executar('proximo_passo', {})}
                                disabled={!!carregando}
                                className="px-3 py-2 bg-navy-700 hover:bg-navy-800 disabled:opacity-60 text-white text-xs font-bold rounded-lg shadow-sm"
                            >
                                {carregando === 'proximo_passo' ? 'Analisando...' : 'Sugerir Próximo Passo'}
                            </button>
                        </div>
                    </div>

                    {erro && <p className="text-xs text-rose-600 bg-rose-50 border border-rose-200 rounded-lg p-2">{erro}</p>}

                    {resultado && (
                        <div className="space-y-2">
                            <p className="text-[11px] text-stone-500">Revise e ajuste o texto abaixo à vontade antes de usar — é uma minuta, não um documento final.</p>
                            <textarea
                                className="w-full p-4 bg-stone-50 border border-stone-200 rounded-lg text-sm leading-relaxed shadow-inner"
                                rows="10"
                                value={resultado}
                                onChange={e => setResultado(e.target.value)}
                            />
                            <div className="flex flex-wrap gap-3">
                                <button onClick={handleCopiar} className="text-xs font-semibold text-indigo-600 hover:text-indigo-800">
                                    <i className="fa-solid fa-copy"></i> {copiado ? 'Copiado!' : 'Copiar texto'}
                                </button>
                                <button onClick={handleBaixarTxt} className="text-xs font-semibold text-indigo-700 hover:text-indigo-900">
                                    <i className="fa-solid fa-file-lines"></i> Baixar .txt
                                </button>
                                <button onClick={() => baixarComoWord(resultado, `ia-${process.numero}`)} className="text-xs font-semibold text-indigo-700 hover:text-indigo-900">
                                    <i className="fa-solid fa-file-word"></i> Baixar em Word
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Integração DataJud/CNJ — busca movimentações oficiais pelo número do processo.
        // As movimentações retornadas são só SUGESTÃO: nunca sobrescrevem fase/próximo
        // prazo automaticamente — o advogado decide o que copiar, via o botão "Editar".
        function DataJudPanel({ process, supabaseClient }) {
            const [carregando, setCarregando] = useState(false);
            const [erro, setErro] = useState('');
            const [movimentacoes, setMovimentacoes] = useState(null);
            const [mensagem, setMensagem] = useState('');
            const [copiadoIdx, setCopiadoIdx] = useState(null);

            const buscar = async () => {
                if (!supabaseClient) { setErro('Cliente Supabase não inicializado.'); return; }
                setCarregando(true);
                setErro('');
                try {
                    const apiKey = await getSecret('DATAJUD_API_KEY');
                    const { data, error } = await invocarFunction(supabaseClient, 'datajud-busca', {
                        body: { numeroCNJ: process.numero, apiKey: apiKey || undefined },
                    });
                    if (error) throw error;
                    if (data && data.error) { setErro(data.error); setMovimentacoes(null); return; }
                    setMovimentacoes(data.movimentacoes || []);
                    setMensagem(data.mensagem || '');
                } catch (e) {
                    setErro(e.message || 'Falha ao consultar o DataJud.');
                    setMovimentacoes(null);
                } finally {
                    setCarregando(false);
                }
            };

            const copiarMovimentacao = (mov, idx) => {
                navigator.clipboard.writeText(mov.nome || '').then(() => {
                    setCopiadoIdx(idx);
                    setTimeout(() => setCopiadoIdx(null), 2000);
                });
            };

            // Carrega sozinho assim que o processo é aberto — antes exigia clicar em
            // "Atualizar do DataJud" pra ver qualquer coisa. O botão continua aqui pra
            // atualizar de novo depois.
            useEffect(() => {
                buscar();
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [process.numero]);

            return (
                <div className="space-y-3">
                    <div className="flex items-center justify-between">
                        <h4 className="text-xs font-bold text-stone-700 uppercase flex items-center gap-2">
                            <i className="fa-solid fa-landmark-flag text-amber-500"></i> Movimentações (DataJud/CNJ)
                        </h4>
                        <button
                            onClick={buscar}
                            disabled={carregando}
                            className="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 disabled:opacity-60 text-stone-950 text-xs font-bold rounded-lg shadow-sm"
                        >
                            {carregando ? 'Buscando...' : 'Atualizar do DataJud'}
                        </button>
                    </div>

                    {erro && <p className="text-xs text-rose-600 bg-rose-50 border border-rose-200 rounded-lg p-2">{erro}</p>}

                    {movimentacoes !== null && (
                        <div className="space-y-2">
                            {mensagem && <p className="text-xs text-stone-500">{mensagem}</p>}
                            {movimentacoes.length > 0 && (
                                <ul className="space-y-1.5 max-h-56 overflow-y-auto pr-1">

                                                    </span>
                                                    <span className="text-stone-700">{mov.nome}</span>
                                                </div>

                                                onClick={() => copiarMovimentacao(mov, idx)}

        // O JurisControl começa focado no Rio de Janeiro (Capital, Grande Rio, Niterói,
        // Região dos Lagos) — por isso essas comarcas aparecem primeiro, como atalho de
        // um clique. O campo continua livre (datalist), então qualquer outro
        // tribunal/comarca do Brasil também pode ser digitado.
        const COMARCAS_RJ_PRIORITARIAS = [
            'TJRJ - Comarca da Capital (Rio de Janeiro)',
            'TJRJ - Comarca de Niterói',
            'TJRJ - Comarca de São Gonçalo',
            'TJRJ - Comarca de Duque de Caxias',
            'TJRJ - Comarca de Nova Iguaçu',
            'TJRJ - Comarca de São João de Meriti',
            'TJRJ - Comarca de Nilópolis',
            'TJRJ - Comarca de Belford Roxo',
            'TJRJ - Comarca de Cabo Frio',
            'TJRJ - Comarca de Búzios',
            'TJRJ - Comarca de Araruama',
            'TJRJ - Comarca de Rio das Ostras',
            'TJRJ - Comarca de Saquarema',
        ];

        const LISTA_TRIBUNAIS_BR = [
            ...COMARCAS_RJ_PRIORITARIAS,
            'STF - Supremo Tribunal Federal', 'STJ - Superior Tribunal de Justiça',
            'TST - Tribunal Superior do Trabalho', 'TSE - Tribunal Superior Eleitoral',
            'TJAC - Tribunal de Justiça do Acre', 'TJAL - Tribunal de Justiça de Alagoas',
            'TJAP - Tribunal de Justiça do Amapá', 'TJAM - Tribunal de Justiça do Amazonas',
            'TJBA - Tribunal de Justiça da Bahia', 'TJCE - Tribunal de Justiça do Ceará',
            'TJDFT - Tribunal de Justiça do Distrito Federal e Territórios',
            'TJES - Tribunal de Justiça do Espírito Santo', 'TJGO - Tribunal de Justiça de Goiás',
            'TJMA - Tribunal de Justiça do Maranhão', 'TJMT - Tribunal de Justiça de Mato Grosso',
            'TJMS - Tribunal de Justiça de Mato Grosso do Sul', 'TJMG - Tribunal de Justiça de Minas Gerais',
            'TJPA - Tribunal de Justiça do Pará', 'TJPB - Tribunal de Justiça da Paraíba',
            'TJPR - Tribunal de Justiça do Paraná', 'TJPE - Tribunal de Justiça de Pernambuco',
            'TJPI - Tribunal de Justiça do Piauí', 'TJRJ - Tribunal de Justiça do Rio de Janeiro (outras comarcas)',
            'TJRN - Tribunal de Justiça do Rio Grande do Norte', 'TJRS - Tribunal de Justiça do Rio Grande do Sul',
            'TJRO - Tribunal de Justiça de Rondônia', 'TJRR - Tribunal de Justiça de Roraima',
            'TJSC - Tribunal de Justiça de Santa Catarina', 'TJSP - Tribunal de Justiça de São Paulo',
            'TJSE - Tribunal de Justiça de Sergipe', 'TJTO - Tribunal de Justiça do Tocantins',
            'TRF1 - Tribunal Regional Federal da 1ª Região', 'TRF2 - Tribunal Regional Federal da 2ª Região (RJ/ES)',
            'TRF3 - Tribunal Regional Federal da 3ª Região', 'TRF4 - Tribunal Regional Federal da 4ª Região',
            'TRF5 - Tribunal Regional Federal da 5ª Região', 'TRF6 - Tribunal Regional Federal da 6ª Região',
            'TRT1 - Tribunal Regional do Trabalho da 1ª Região (RJ)', 'TRT2 - Tribunal Regional do Trabalho da 2ª Região (SP)',
            'TRT3 - Tribunal Regional do Trabalho da 3ª Região (MG)', 'TRT4 - Tribunal Regional do Trabalho da 4ª Região (RS)',
        ];

        // Tenta sugerir o tribunal a partir do texto da vara/ação do processo — só um
        // atalho pra pré-preencher o formulário, o(a) advogado(a) sempre pode trocar.
        function sugerirTribunal(process) {
            const texto = `${process?.vara || ''} ${process?.acao || ''}`.toUpperCase();
            if (texto.includes('NITER')) return 'TJRJ - Comarca de Niterói';
            if (texto.includes('CABO FRIO')) return 'TJRJ - Comarca de Cabo Frio';
            if (texto.includes('CAPITAL') || texto.includes('RIO DE JANEIRO')) return 'TJRJ - Comarca da Capital (Rio de Janeiro)';
            const encontrado = LISTA_TRIBUNAIS_BR.find(t => texto.includes(t.split(' - ')[0]));
            return encontrado || '';
        }

        function TribunalModal({ registroInicial, onClose, onSave }) {
            const [tribunal, setTribunal] = useState(registroInicial?.tribunal || '');
            const [vara, setVara] = useState(registroInicial?.vara || '');
            const [notas, setNotas] = useState(registroInicial?.notas || '');

            const handleSubmit = (e) => {
                e.preventDefault();

                    ...(registroInicial || {}),
                    tribunal: tribunal.trim(), vara: vara.trim(), notas: notas.trim(),
                    contato: contato.trim(), link: link.trim(),

                        <form onSubmit={handleSubmit} className="space-y-3">

                                <label className="block text-xs font-semibold text-stone-600 mb-1">Tribunal / Comarca *</label>

                                <div className="flex flex-wrap gap-1.5 mt-2">
                                    {COMARCAS_RJ_PRIORITARIAS.slice(0, 6).map(c => (
                                        <button key={c} type="button" onClick={() => setTribunal(c)} className="text-[10px] px-2 py-1 bg-stone-100 hover:bg-amber-100 text-stone-600 rounded-full">
                                            {c.replace('TJRJ - Comarca ', '').replace(' da Capital (Rio de Janeiro)', 'Capital')}
                                        </button>
                                    ))}
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-stone-600 mb-1">Vara / Câmara (opcional)</label>
                                <input value={vara} onChange={e => setVara(e.target.value)} placeholder="Ex: 3ª Vara Cível" className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-lg text-sm" />

                                <textarea value={notas} onChange={e => setNotas(e.target.value)} rows={5} placeholder="Ex: peticionamento só via PJe, secretaria atende só de manhã, juiz costuma exigir laudo pericial em ações de saúde..." className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-lg text-sm" />

                                <div>
                                    <label className="block text-xs font-semibold text-stone-600 mb-1">Contato (opcional)</label>

                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-stone-600 mb-1">Link útil (opcional)</label>
                                    <input value={link} onChange={e => setLink(e.target.value)} placeholder="https://..." className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-lg text-sm" />
                                </div>
                            </div>
                            <div className="flex justify-end gap-2 pt-2">
                                <button type="button" onClick={onClose} className="px-4 py-2 bg-stone-100 text-stone-700 text-sm font-semibold rounded-lg">Cancelar</button>
                                <button type="submit" className="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-stone-950 font-semibold rounded-lg text-sm">Salvar</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

                    {modalAberto && (

        }

        const ABAS_PROCESSO = [
            { id: 'geral', label: 'Visão Geral', icon: 'fa-circle-info' },
            { id: 'jurisprudencia', label: 'Jurisprudência', icon: 'fa-scale-balanced' },
            { id: 'ia', label: 'Assistente de IA & Documentos', icon: 'fa-wand-magic-sparkles' },

        // Edição rápida da fase processual, sem precisar abrir o modal de edição inteiro.

        // Tribunal/comarca em formato compacto (dropdown de siglas) — mantém acesso à
        // mesma anotação livre do TribunalModal, mostrando o texto da nota já salva.

            const sugestao = sugerirTribunal(process);
            const [selecionado, setSelecionado] = useState(sugestao || '');
            const [modalAberto, setModalAberto] = useState(false);
            const notaExistente = tribunais.find(t => t.tribunal === selecionado);

                        </select>
                        <button onClick={() => setModalAberto(true)} disabled={!selecionado} className="px-3 py-2 bg-stone-100 hover:bg-amber-100 disabled:opacity-40 text-stone-600 rounded-lg text-xs font-semibold whitespace-nowrap">

                    {modalAberto && (
                        <TribunalModal
                            registroInicial={notaExistente || { tribunal: selecionado, vara: process.vara || '' }}
                            onClose={() => setModalAberto(false)}

        // Lançamentos financeiros vinculados a este processo especificamente
        // (financials com processoId === process.id) — cria via FinancialModal

        function ProcessDetailsModal({ process, clients, financials, session, tribunais, onSalvarTribunal, onAddFinancial, onToggleFinancialStatus, onUpdateProcess, modelosDocumento, onSalvarModelo, onClose, onEdit, supabaseClient }) {
            const [abaAtiva, setAbaAtiva] = useState('geral');
            const [jurisprudencia, setJurisprudencia] = useState(null); // null = ainda não buscou
            const [loadingJuris, setLoadingJuris] = useState(false);
            const [erroJuris, setErroJuris] = useState(null);

            useEffect(() => {
                let cancelado = false;
                // process.acao pode vir muito longo em processos importados do DJEN
                // (texto bruto da publicação) — um termo de busca curto funciona melhor.
                const acaoCurta = (process.acao || '').split(/\s+/).slice(0, 8).join(' ');
                const termo = (acaoCurta || process.area || '').trim();
                if (!termo || !supabaseClient) return;

                setLoadingJuris(true);
                setErroJuris(null);

                // Só TJRJ tem fonte real hoje (eproc do próprio tribunal) — os outros
                // tribunais saíram da busca até termos uma fonte de dados de verdade
                // pra eles (sem exibir resultado simulado/fake no lugar).
                invocarFunction(supabaseClient, 'busca-jurisprudencia', { body: { termo, uf: process.uf || 'RJ' } })
                    .then(({ data, error }) => {
                        if (cancelado) return;
                        if (error) throw error;
                        setJurisprudencia(data);
                    })
                    .catch(err => {
                        if (cancelado) return;
                        console.error('Erro ao buscar jurisprudência:', err);
                        setErroJuris('Não foi possível buscar jurisprudência relacionada agora.');
                    })
                    .finally(() => { if (!cancelado) setLoadingJuris(false); });

                return () => { cancelado = true; };
            }, [process.id]);

            return (
                <div className="fixed inset-0 bg-navy-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl max-w-5xl w-full h-[88vh] shadow-2xl flex flex-col overflow-hidden">
                        <div className="flex justify-between items-center border-b px-6 py-4 flex-shrink-0">
                            <div>
                                <span className="text-xs font-bold text-amber-600 uppercase">{process.area}</span>
                                <h3 className="font-bold text-lg text-stone-900">{process.numero}</h3>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => onEdit(process)} className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-lg shadow-sm flex items-center gap-2">
                                    <i className="fa-solid fa-pen"></i> Editar
                                </button>
                                <button onClick={onClose} className="text-stone-400 hover:text-stone-600 p-1.5"><i className="fa-solid fa-xmark text-lg"></i></button>
                            </div>
                        </div>

                        {/* Abas — evita empilhar tudo verticalmente numa coluna estreita */}
                        <div className="flex items-center gap-1 px-4 pt-3 border-b overflow-x-auto flex-shrink-0">
                            {ABAS_PROCESSO.map(aba => (
                                <button
                                    key={aba.id}
                                    onClick={() => setAbaAtiva(aba.id)}
                                    className={`px-3 py-2 text-xs font-semibold rounded-t-lg whitespace-nowrap flex items-center gap-1.5 transition ${
                                        abaAtiva === aba.id
                                            ? 'bg-stone-100 text-stone-900 border-b-2 border-amber-500'
                                            : 'text-stone-500 hover:text-stone-800 hover:bg-stone-50'
                                    }`}
                                >
                                    <i className={`fa-solid ${aba.icon}`}></i> {aba.label}
                                </button>
                            ))}
                        </div>

                        <div className="flex-1 overflow-y-auto p-6">
                            {abaAtiva === 'geral' && (
                                <div className="space-y-6">
                                    {/* Resumo compacto do processo — antes era uma coluna inteira,
                                        agora é uma faixa horizontal pra sobrar espaço pra
                                        Movimentações/Financeiro abaixo, meio a meio. */}
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 pb-5 border-b border-stone-200 text-sm text-stone-700">
                                        <div>
                                            <span className="block text-[10px] uppercase tracking-wider text-stone-400 font-bold mb-0.5">Cliente</span>
                                            {process.clienteNome}
                                        </div>
                                        <div>
                                            <span className="block text-[10px] uppercase tracking-wider text-stone-400 font-bold mb-0.5">Vara/Tribunal</span>
                                            {process.vara}
                                        </div>
                                        <div className="sm:col-span-2 lg:col-span-1">
                                            <span className="block text-[10px] uppercase tracking-wider text-stone-400 font-bold mb-0.5">Ação</span>
                                            {process.acao}
                                        </div>
                                        <div>
                                            <span className="block text-[10px] uppercase tracking-wider text-stone-400 font-bold mb-0.5">Valor da Causa</span>
                                            R$ {Number(process.valorCausa).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                                        </div>
                                        <div className="sm:col-span-2">
                                            <FaseRapidaEditor process={process} onUpdateProcess={onUpdateProcess} />
                                        </div>
                                        {process.honorariosContratados > 0 && (
                                            <div>
                                                <span className="block text-[10px] uppercase tracking-wider text-stone-400 font-bold mb-0.5">Honorários Contratados</span>
                                                R$ {Number(process.honorariosContratados).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                                            </div>
                                        )}
                                        <div className="sm:col-span-2 lg:col-span-4">
                                            <TribunalDropdownGeral process={process} tribunais={tribunais} onSalvarTribunal={onSalvarTribunal} />
                                        </div>
                                        {process.proximoPrazo && (
                                            <div className="sm:col-span-2 lg:col-span-4 p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-900">
                                                <strong>Próximo Prazo:</strong> {process.descricaoPrazo} (Vencimento: {new Date(process.proximoPrazo + 'T00:00:00').toLocaleDateString('pt-BR')})
                                            </div>
                                        )}
                                    </div>

                                    {/* Movimentações (DataJud) ocupa metade da tela — antes dividia
                                        espaço com o Financeiro, agora tem a coluna inteira pra si. */}
                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                        <div>
                                            <DataJudPanel process={process} supabaseClient={supabaseClient} />
                                        </div>
                                        <div>
                                            <FinanceiroDoProcessoPanel process={process} clients={clients} financials={financials} onAddFinancial={onAddFinancial} onToggleStatus={onToggleFinancialStatus} />
                                        </div>
                                    </div>
                                </div>
                            )}

                            {abaAtiva === 'jurisprudencia' && (
                                <div>
                                    <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
                                        <h4 className="font-bold text-stone-900 text-sm flex items-center gap-2">
                                            <i className="fa-solid fa-scale-balanced text-indigo-500"></i> Jurisprudência Relacionada
                                            <span className="text-[10px] font-bold text-stone-400 uppercase font-normal normal-case">— TJRJ</span>
                                        </h4>
                                        {jurisprudencia && !loadingJuris && (
                                            <span className="text-[10px] font-bold px-2 py-0.5 rounded uppercase whitespace-nowrap bg-emerald-100 text-emerald-700">
                                                Real ({jurisprudencia.fonte})
                                            </span>
                                        )}
                                    </div>
                                    <p className="text-[11px] text-stone-400 -mt-2 mb-3">
                                        Por enquanto só o TJRJ tem fonte pública com acesso automatizado liberado —
                                        os outros tribunais saem daqui assim que houver uma fonte de dados real pra eles.
                                    </p>

                                    {loadingJuris && (
                                        <p className="text-xs text-stone-400"><i className="fa-solid fa-spinner fa-spin mr-2"></i>Buscando jurisprudência relacionada...</p>
                                    )}
                                    {erroJuris && <p className="text-xs text-rose-600">{erroJuris}</p>}
                                    {jurisprudencia && jurisprudencia.mensagem && (
                                        <p className="text-[11px] text-stone-400 mb-2">{jurisprudencia.mensagem}</p>
                                    )}
                                    {jurisprudencia && (!jurisprudencia.resultados || jurisprudencia.resultados.length === 0) && !loadingJuris && (
                                        <p className="text-xs text-stone-400">Nenhum resultado encontrado para este assunto.</p>
                                    )}

                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
                                        {(jurisprudencia?.resultados || []).map((r, idx) => <JurisprudenciaResultCard key={idx} r={r} />)}
                                    </div>
                                </div>
                            )}

                            {abaAtiva === 'ia' && (
                                <div className="space-y-6">
                                    {/* Antes essa aba inteira ficava presa num max-w-3xl — sobrava
                                        de largura pro AiAssistPanel (só um select+botão+textarea) e
                                        faltava pro DocumentGeneratorView, que é desenhado pra 3
                                        colunas largas. Cada bloco agora usa a largura que faz
                                        sentido pra si. */}
                                    <div className="max-w-2xl bg-stone-50 border border-stone-200 rounded-2xl p-5">
                                        <AiAssistPanel process={process} supabaseClient={supabaseClient} />
                                    </div>
                                    <div className="pt-2 border-t border-stone-200">
                                        <h4 className="text-xs font-bold text-stone-700 uppercase flex items-center gap-2 mb-4 pt-4">
                                            <i className="fa-solid fa-file-signature text-indigo-700"></i> Gerar Documento deste Processo
                                        </h4>
                                        <DocumentGeneratorView clients={clients} processes={[]} session={session} processoFixo={process} modelosDocumento={modelosDocumento} onSalvarModelo={onSalvarModelo} supabaseClient={supabaseClient} />
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
