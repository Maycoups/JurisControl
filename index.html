<html lang="pt-BR">
<head>

    <script>
        tailwind.config = {

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Configuração Supabase (integração TJRJ, jurisprudência, IA, DataJud) ---
        // Chave anon/publishable: é segura para uso no client, mas garanta que
        // as políticas de RLS da tabela/Edge Function no Supabase estejam corretas.
        // Observação: em versões anteriores esta inicialização falhava porque a
        // variável local se chamava "supabase", sombreando o objeto global "window.supabase"
        // antes de chamar .createClient() nele. Por isso usamos window.supabase explicitamente.
        const SUPABASE_URL = 'https://yenznpfqqocdkzlcfhdv.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_glTe9_IZ-TxaddwodCc5ZA__wbgYsUh';
        let supabaseClient = null;
        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {
            console.error('Erro ao iniciar o cliente Supabase (integrações ficarão indisponíveis):', e);
        }

        // --- Credenciais locais (chaves de IA "traga a sua", DataJud) ---
        // No app instalado (Electron), ficam criptografadas via safeStorage, fora
        // da pasta do projeto (ver preload.js / main.js) — nunca em texto puro,
        // nunca no código-fonte. Na versão web não existe esse armazenamento
        // criptografado do sistema operacional, então caímos para o
        // localStorage do próprio navegador (funciona, mas não é criptografado —
        // por isso a interface avisa quando está nesse modo). Em qualquer um dos
        // dois casos, a chave só sai do dispositivo na hora de usar (uma
        // chamada) e nunca fica salva no nosso servidor.
        const PREFIXO_SECRET_LOCAL = 'jc_secret_';

        async function armazenamentoSeguroDisponivel() {
            if (!window.jcSecrets) return false;
            try { return await window.jcSecrets.disponivel(); } catch { return false; }
        }

        async function getSecret(nome) {
            if (window.jcSecrets) {
                try {
                    const valor = await window.jcSecrets.get(nome);
                    if (valor) return valor;
                } catch { /* cai pro fallback abaixo */ }
            }
            try {
                return localStorage.getItem(PREFIXO_SECRET_LOCAL + nome) || null;
            } catch {
                return null;
            }
        }

        async function setSecret(nome, valor) {
            if (window.jcSecrets) {
                try {
                    const resultado = await window.jcSecrets.set(nome, valor);
                    if (resultado && resultado.ok) return { ok: true, seguro: true };
                } catch { /* cai pro fallback abaixo */ }
            }
            try {
                localStorage.setItem(PREFIXO_SECRET_LOCAL + nome, valor);
                return { ok: true, seguro: false };
            } catch (e) {
                return { ok: false, erro: e.message };
            }
        }

        async function deleteSecret(nome) {
            if (window.jcSecrets) {
                try { await window.jcSecrets.delete(nome); } catch { /* ignora */ }
            }
            try { localStorage.removeItem(PREFIXO_SECRET_LOCAL + nome); } catch { /* ignora */ }
        }

        // --- Tema claro/escuro ---
        // Preferência salva no próprio dispositivo (mesmo padrão do resto do app:
        // localStorage, sem depender de rede). Aplicamos a classe "dark" na tag
        // <html> assim que o script carrega (fora de qualquer componente React)
        // pra não piscar o tema errado antes do primeiro render.
        const TEMA_STORAGE_KEY = 'jc_tema';

        function obterTemaSalvo() {
            try {
                return localStorage.getItem(TEMA_STORAGE_KEY) === 'escuro' ? 'escuro' : 'claro';
            } catch {
                return 'claro';
            }
        }

        function aplicarTema(tema) {
            document.documentElement.classList.toggle('dark', tema === 'escuro');
        }

        aplicarTema(obterTemaSalvo());

        function ThemeToggle() {
            const [tema, setTema] = useState(obterTemaSalvo());

            const alternar = () => {
                const novoTema = tema === 'escuro' ? 'claro' : 'escuro';
                setTema(novoTema);
                aplicarTema(novoTema);
                try { localStorage.setItem(TEMA_STORAGE_KEY, novoTema); } catch { /* ignora */ }
            };

            return (
                <button
                    onClick={alternar}
                    title={tema === 'escuro' ? 'Mudar para modo claro' : 'Mudar para modo escuro'}
                    className="text-stone-500 hover:text-amber-600 hover:bg-amber-50 p-1.5 rounded-lg transition dark:text-stone-400 dark:hover:text-amber-400 dark:hover:bg-navy-800 flex-shrink-0"
                >

        const CNJ_REGEX = /^\d{7}-\d{2}\.\d{4}\.\d{1}\.\d{2}\.\d{4}$/;

        // Termos de Uso e Política de Privacidade — texto redigido fora do app (LGPD),

        const TERMOS_DE_USO = {
            titulo: 'JurisControl — Termos de Uso e Política de Privacidade',
            subtitulo: 'Conformidade com a Lei Geral de Proteção de Dados (Lei nº 13.709/2018 — LGPD)',

                { h: '2.1. Papéis na Proteção de Dados', p: 'Nos termos da Lei nº 13.709/2018 (LGPD): Controlador é o Usuário (Advogado ou Escritório) em relação aos dados pessoais de seus clientes inseridos na plataforma. Operador é o JurisControl, que processa os dados em nome do Controlador para prestar os serviços contratados.' },

                        ['Dados dos Clientes', 'Nome, CPF/CNPJ, e-mail, telefone, contrato', 'Execução de Contrato / Cumprimento de Obrigação Legal', 'Gestão de carteira de clientes, vinculação a processos e emissão de alertas.'],
                        ['Dados Processuais', 'Número CNJ, classe, assunto, órgão julgador, histórico', 'Exercício Regular de Direitos / Dados Públicos (Art. 7º, VI)', 'Exibição no painel de controle, monitoramento e geração de documentos.'],
                    ],
                } },
                { h: '2.3. Segurança e Armazenamento dos Dados', p: 'Todos os dados são armazenados em infraestrutura segura com encriptação em trânsito (TLS/HTTPS) e em repouso. O acesso à base de dados é protegido por políticas de Row Level Security (RLS), garantindo que cada Usuário acesse estritamente os seus próprios registros.' },
                { h: '2.4. Direitos dos Titulares de Dados', p: 'Os titulares dos dados têm o direito de solicitar a confirmação do tratamento, acesso, correção, anonimização, eliminação ou portabilidade de seus dados pessoais, mediante solicitação formal ao Encarregado pelo Tratamento de Dados (DPO) da plataforma.' },
                { h: '2.5. Alterações nesta Política', p: 'Esta Política pode ser atualizada periodicamente para refletir melhorias no sistema ou adequações regulatórias. Notificações sobre alterações relevantes serão enviadas aos Usuários cadastrados.' },
            ],
        };

        function TermosDeUsoModal({ onClose }) {
            return (
                <div className="fixed inset-0 bg-navy-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl max-w-2xl w-full max-h-[85vh] overflow-y-auto p-6 shadow-2xl space-y-4">
                        <div className="flex justify-between items-start border-b pb-3">
                            <div>

                                                <thead className="bg-stone-50">
                                                    <tr>{s.tabela.colunas.map(c => <th key={c} className="text-left p-2 font-semibold text-stone-600 border-b">{c}</th>)}</tr>
                                                </thead>
                                                <tbody>
                                                    {s.tabela.linhas.map((linha, li) => (

                                                            {linha.map((cel, ci) => <td key={ci} className="p-2 text-stone-600 align-top">{cel}</td>)}
                                                        </tr>
                                                    ))}
                                                </tbody>

                            ))}
                        </div>
                        <div className="flex justify-end pt-3 border-t">

            );
        }

        // supabaseClient.functions.invoke() sempre devolve error.message genérico
        // ("Edge Function returned a non-2xx status code"), mesmo quando a function
        // manda uma mensagem específica e útil no corpo da resposta (ex: "IA
        // gratuita indisponível...", "Não autenticado..."). A mensagem de verdade
        // fica em error.context (a Response crua), que a biblioteca não lê sozinha
        // — confirmado testando ao vivo. Este helper tem a mesma assinatura de
        // functions.invoke(), só que com error.message já sendo o texto real
        // quando a function devolveu um `{ error: "..." }` no corpo.
        async function invocarFunction(supabaseClient, nome, opcoes) {
            const resultado = await supabaseClient.functions.invoke(nome, opcoes);
            if (resultado.error && resultado.error.context) {
                try {
                    const corpo = await resultado.error.context.json();
                    if (corpo && corpo.error) {
                        resultado.error = new Error(corpo.error);
                        resultado.error.detalhes = corpo;
                    }
                } catch { /* corpo não era JSON — mantém a mensagem genérica original */ }
            }
            return resultado;
        }

        // --- Exportar texto como .docx real (Word) ---
        // html-docx-js roda 100% no navegador (gratuita, MIT) e converte um HTML
        // completo num Blob .docx que o Word abre nativamente, sem servidor nenhum.
        function baixarComoWord(texto, nomeArquivo) {
            if (!window.htmlDocx) {
                alert('Exportação para Word indisponível no momento (biblioteca não carregou). Tente copiar o texto manualmente.');
                return;
            }
            const linhasHtml = String(texto)
                .split('\n')
                .map(linha => `<p>${linha.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') || '&nbsp;'}</p>`)
                .join('\n');
            const htmlCompleto = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>
                body { font-family: 'Times New Roman', serif; font-size: 12pt; line-height: 1.5; }
                p { margin: 0 0 8pt 0; }
            </style></head><body>${linhasHtml}</body></html>`;
            const blob = window.htmlDocx.asBlob(htmlCompleto);
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = nomeArquivo.endsWith('.docx') ? nomeArquivo : `${nomeArquivo}.docx`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 5000);
        }

        // --- Urgência de prazo (usada no Kanban) ---
        // Retorna null se não há prazo, ou { dias, nivel, label } onde nivel é
        // 'vencido' | 'urgente' (até 3 dias) | 'atencao' (até 7 dias) | 'ok'.
        function calcularUrgenciaPrazo(dataISO) {
            if (!dataISO) return null;
            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0);
            const prazo = new Date(dataISO + 'T00:00:00');
            const dias = Math.round((prazo - hoje) / 86400000);
            let nivel = 'ok';
            if (dias < 0) nivel = 'vencido';
            else if (dias <= 3) nivel = 'urgente';
            else if (dias <= 7) nivel = 'atencao';
            const label = dias < 0 ? `Vencido há ${Math.abs(dias)}d` : dias === 0 ? 'Vence hoje' : `${dias}d restantes`;
            return { dias, nivel, label };
        }

        // Componente de topo: só decide o que mostrar com base na sessão de
        // autenticação (Supabase Auth). Sem sessão -> tela de login. Com sessão ->
        // o app completo (AppLogado), já amarrado ao usuário logado.
        function App() {
            const [session, setSession] = useState(undefined); // undefined = verificando | null = deslogado | objeto = logado

            useEffect(() => {
                if (!supabaseClient) { setSession(null); return; }
                supabaseClient.auth.getSession().then(({ data }) => setSession(data.session));
                const { data: assinatura } = supabaseClient.auth.onAuthStateChange((_evento, novaSessao) => {
                    setSession(novaSessao);
                });
                return () => assinatura.subscription.unsubscribe();
            }, []);

            if (!supabaseClient) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-stone-100 p-6">
                        <div className="max-w-md text-center space-y-3 bg-white p-8 rounded-2xl shadow-sm border border-stone-200">
                            <i className="fa-solid fa-triangle-exclamation text-3xl text-rose-500"></i>
                            <h2 className="font-bold text-stone-900">Não foi possível iniciar o sistema</h2>
                            <p className="text-sm text-stone-500">Falha ao conectar com o Supabase. Recarregue a página; se o problema continuar, entre em contato com o administrador.</p>
                        </div>
                    </div>
                );
            }

            if (session === undefined) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-stone-100">
                        <i className="fa-solid fa-scale-balanced text-4xl text-amber-500 animate-pulse"></i>
                    </div>
                );
            }

            if (!session) {
                return <LoginView supabaseClient={supabaseClient} />;
            }

            return <AppLogado session={session} supabaseClient={supabaseClient} />;
        }

        function LoginView({ supabaseClient }) {
            const [modo, setModo] = useState('entrar'); // 'entrar' | 'criar' | 'recuperar'
            // O cadastro é feito em etapas (uma pergunta de cada vez) em vez de um
            // formulário só: fica mais simples de preencher, e nome/OAB já ficam
            // guardados desde a criação da conta — sem precisar passar por
            // Configurações depois pra a IA/telas conseguirem chamar o usuário pelo nome.
            const [passoCadastro, setPassoCadastro] = useState('nome'); // 'nome' | 'oab' | 'credenciais'
            const [nome, setNome] = useState('');
            const [oab, setOab] = useState('');
            const [email, setEmail] = useState('');
            const [senha, setSenha] = useState('');
            const [carregando, setCarregando] = useState(false);
            const [mensagem, setMensagem] = useState(null); // { tipo: 'erro'|'sucesso', texto }

            const irParaCriarConta = () => {
                setModo('criar');
                setPassoCadastro('nome');
                setMensagem(null);
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setMensagem(null);

                // Nos dois primeiros passos do cadastro, o "submit" só avança pra
                // próxima pergunta — a conta só é criada de fato no passo final.
                if (modo === 'criar' && passoCadastro === 'nome') {
                    if (!nome.trim()) { setMensagem({ tipo: 'erro', texto: 'Digite como podemos te chamar.' }); return; }
                    setPassoCadastro('oab');
                    return;
                }
                if (modo === 'criar' && passoCadastro === 'oab') {
                    setPassoCadastro('credenciais');
                    return;
                }

                setCarregando(true);
                try {
                    if (modo === 'entrar') {
                        const { error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
                        if (error) throw error;
                    } else if (modo === 'criar') {
                        if (senha.length < 6) {
                            setMensagem({ tipo: 'erro', texto: 'A senha precisa ter pelo menos 6 caracteres.' });
                            setCarregando(false);
                            return;
                        }
                        // Verifica o convite ANTES de tentar criar a conta — evita depender da
                        // mensagem de erro do signUp() em caso de recusa (o cliente Supabase
                        // trata a recusa como erro "retentável" e troca a mensagem original por
                        // um texto genérico depois de tentar de novo sozinho).
                        const { data: convite, error: erroConvite } = await invocarFunction(supabaseClient, 'verificar-convite', { body: { email } });
                        if (erroConvite) {
                            setMensagem({ tipo: 'erro', texto: 'Não foi possível verificar o convite agora. Tente novamente em instantes.' });
                            setCarregando(false);
                            return;
                        }
                        if (!convite || !convite.permitido) {
                            setMensagem({ tipo: 'erro', texto: 'Este e-mail não está na lista de convidados do JurisControl. Peça acesso ao administrador.' });
                            setCarregando(false);
                            return;
                        }
                        // nome/OAB já vão junto na criação da conta (user_metadata), então o
                        // app já sabe como chamar o usuário desde o primeiro login.
                        const { data, error } = await supabaseClient.auth.signUp({
                            email, password: senha,
                            options: { data: { nome: nome.trim(), oab: oab.trim() } },
                        });
                        if (error) throw error;
                        if (data.session) {
                            // Projeto sem confirmação de e-mail obrigatória: já entra direto.
                        } else {
                            setMensagem({ tipo: 'sucesso', texto: 'Conta criada! Verifique seu e-mail para confirmar o cadastro antes de entrar.' });
                            setModo('entrar');
                        }
                    } else if (modo === 'recuperar') {
                        const { error } = await supabaseClient.auth.resetPasswordForEmail(email);
                        if (error) throw error;
                        setMensagem({ tipo: 'sucesso', texto: 'Se este e-mail estiver cadastrado, enviamos um link para redefinir a senha.' });
                        setModo('entrar');
                    }
                } catch (err) {
                    setMensagem({ tipo: 'erro', texto: err.message || 'Algo deu errado. Tente novamente.' });
                } finally {
                    setCarregando(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-navy-950 p-4">
                    <div className="w-full max-w-sm">
                        <div className="flex flex-col items-center mb-8">
                            <div className="jc-seal bg-gradient-to-tr from-amber-500 to-amber-300 text-navy-950 p-3.5 shadow-lg mb-4">
                                <i className="fa-solid fa-scale-balanced text-3xl"></i>
                            </div>
                            <h1 className="font-bold text-white text-2xl tracking-tight">JurisControl</h1>
                            <p className="text-navy-300 text-sm">Gestão para Advogados Independentes</p>
                        </div>

                        <div className="bg-white rounded-2xl shadow-2xl p-6 space-y-4">
                            {modo !== 'recuperar' && (
                                <div className="flex bg-stone-100 rounded-xl p-1">
                                    <button
                                        type="button"
                                        onClick={() => { setModo('entrar'); setMensagem(null); }}
                                        className={`flex-1 py-2 rounded-lg text-sm font-semibold transition ${modo === 'entrar' ? 'bg-white shadow-sm text-stone-900' : 'text-stone-500'}`}
                                    >
                                        Entrar
                                    </button>
                                    <button
                                        type="button"
                                        onClick={irParaCriarConta}
                                        className={`flex-1 py-2 rounded-lg text-sm font-semibold transition ${modo === 'criar' ? 'bg-white shadow-sm text-stone-900' : 'text-stone-500'}`}
                                    >
                                        Criar conta
                                    </button>
                                </div>
                            )}
                            {modo === 'recuperar' && (
                                <h2 className="font-bold text-stone-900 text-center">Recuperar senha</h2>
                            )}

                            {modo === 'criar' && (
                                <div className="flex items-center justify-center gap-1.5 pt-1">
                                    {['nome', 'oab', 'credenciais'].map(p => (
                                        <span key={p} className={`h-1.5 rounded-full transition-all ${p === passoCadastro ? 'w-6 bg-amber-500' : 'w-1.5 bg-stone-200'}`}></span>
                                    ))}
                                </div>
                            )}

                            {mensagem && (
                                <div className={`p-3 rounded-xl text-xs font-medium ${mensagem.tipo === 'erro' ? 'bg-rose-50 text-rose-700 border border-rose-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`}>
                                    {mensagem.texto}
                                </div>
                            )}

                            <form onSubmit={handleSubmit} className="space-y-3">
                                {modo === 'criar' && passoCadastro === 'nome' && (
                                    <div>
                                        <label className="block text-sm font-semibold text-stone-800 mb-1">Como podemos te chamar?</label>
                                        <p className="text-xs text-stone-400 mb-2">Não precisa ser o nome completo — é só pra te chamar pelo nome nas telas e no assistente de IA.</p>
                                        <input
                                            autoFocus
                                            required
                                            type="text"
                                            value={nome}
                                            onChange={e => setNome(e.target.value)}
                                            className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                            placeholder="Ex: Camila"
                                        />
                                    </div>
                                )}

                                {modo === 'criar' && passoCadastro === 'oab' && (
                                    <div>
                                        <label className="block text-sm font-semibold text-stone-800 mb-1">Qual sua OAB?</label>
                                        <p className="text-xs text-stone-400 mb-2">Opcional — pode deixar em branco e preencher depois em Configurações.</p>
                                        <input
                                            autoFocus
                                            type="text"
                                            value={oab}
                                            onChange={e => setOab(e.target.value)}
                                            className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                            placeholder="Ex: 172090/RJ"
                                        />
                                    </div>
                                )}

                                {modo !== 'criar' && (
                                    <div>
                                        <label className="block text-xs font-semibold text-stone-600 mb-1">E-mail</label>
                                        <input
                                            required
                                            type="email"
                                            value={email}
                                            onChange={e => setEmail(e.target.value)}
                                            className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                            placeholder="seuemail@exemplo.com"
                                        />
                                    </div>
                                )}
                                {modo !== 'recuperar' && modo !== 'criar' && (
                                    <div>
                                        <label className="block text-xs font-semibold text-stone-600 mb-1">Senha</label>
                                        <input
                                            required
                                            type="password"
                                            value={senha}
                                            onChange={e => setSenha(e.target.value)}
                                            minLength={6}
                                            className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                            placeholder="••••••••"
                                        />
                                    </div>
                                )}
                                {modo === 'criar' && passoCadastro === 'credenciais' && (
                                    <>
                                        <div>
                                            <label className="block text-sm font-semibold text-stone-800 mb-1">Agora seu e-mail e senha</label>
                                            <p className="text-xs text-stone-400 mb-2">Prazer, {nome.trim() || 'advogado(a)'}! Só falta isso pra criar sua conta.</p>
                                            <input
                                                autoFocus
                                                required
                                                type="email"
                                                value={email}
                                                onChange={e => setEmail(e.target.value)}
                                                className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                                placeholder="seuemail@exemplo.com"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-stone-600 mb-1">Senha</label>
                                            <input
                                                required
                                                type="password"
                                                value={senha}
                                                onChange={e => setSenha(e.target.value)}
                                                minLength={6}
                                                className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                                placeholder="••••••••"
                                            />
                                        </div>
                                    </>
                                )}

                                <button
                                    type="submit"
                                    disabled={carregando}
                                    className="w-full py-2.5 bg-amber-500 hover:bg-amber-600 text-stone-950 font-bold rounded-xl text-sm shadow-sm transition disabled:opacity-60"
                                >
                                    {carregando
                                        ? <i className="fa-solid fa-spinner fa-spin"></i>
                                        : modo === 'entrar' ? 'Entrar'
                                        : modo === 'recuperar' ? 'Enviar link de recuperação'
                                        : passoCadastro === 'credenciais' ? 'Criar conta'
                                        : 'Continuar'}
                                </button>
                            </form>

                            {modo === 'criar' && passoCadastro !== 'nome' && (
                                <button
                                    onClick={() => { setMensagem(null); setPassoCadastro(passoCadastro === 'credenciais' ? 'oab' : 'nome'); }}
                                    className="w-full text-center text-xs text-stone-400 hover:text-stone-600"
                                >
                                    <i className="fa-solid fa-arrow-left mr-1"></i> Voltar
                                </button>
                            )}
                            {modo === 'entrar' && (
                                <button onClick={() => { setModo('recuperar'); setMensagem(null); }} className="w-full text-center text-xs text-stone-400 hover:text-stone-600">
                                    Esqueci minha senha
                                </button>
                            )}
                            {modo === 'recuperar' && (
                                <button onClick={() => { setModo('entrar'); setMensagem(null); }} className="w-full text-center text-xs text-stone-400 hover:text-stone-600">
                                    <i className="fa-solid fa-arrow-left mr-1"></i> Voltar para o login
                                </button>
                            )}
                        </div>
                        <p className="text-center text-stone-500 text-xs mt-6">Acesso restrito. Seus dados ficam protegidos e visíveis só para você.</p>
                    </div>
                </div>
            );
        }

        function AppLogado({ session, supabaseClient }) {
            const userId = session.user.id;

            // Persistent States — clientes/processos/financeiro moram no Supabase,
            // protegidos por RLS (só o próprio usuário enxerga suas linhas). Alertas
            // e OABs monitoradas ainda ficam no localStorage (ver Index.html — nota
            // no plano de V1: são mais "cache do feed do DJEN" que dado de negócio).
            const [activeTab, setActiveTab] = useState('dashboard');
            const [clients, setClients] = useState([]);
            const [processes, setProcesses] = useState([]);
            const [financials, setFinancials] = useState([]);
            const [tribunaisConhecimento, setTribunaisConhecimento] = useState([]);
            const [modelosDocumento, setModelosDocumento] = useState([]);
            const [dadosCarregados, setDadosCarregados] = useState(false);
            const [erroCarregamento, setErroCarregamento] = useState(null);
            const [alertas, setAlertas] = useState(() => {
                const local = localStorage.getItem('jc_alertas');
                return local ? JSON.parse(local) : [];
            });
            const [oabsMonitoradas, setOabsMonitoradas] = useState(() => {
                const local = localStorage.getItem('jc_oabs');
                return local ? JSON.parse(local) : [];
            });

            // UI States
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [toastMessage, setToastMessage] = useState('');

            // Modals
            const [clientModal, setClientModal] = useState(null); // null | 'new' | clienteObjeto (edição)
            const [processModal, setProcessModal] = useState(null); // null=fechado | 'new' | objeto do processo (edição)
            const [showFinancialModal, setShowFinancialModal] = useState(false);
            const [selectedProcess, setSelectedProcess] = useState(null);

            // Carrega clientes/processos/financeiro do Supabase ao logar (ou trocar de conta)
            useEffect(() => {
                let cancelado = false;
                async function carregarDados() {
                    setDadosCarregados(false);
                    setErroCarregamento(null);
                    const [clientesRes, processosRes, financeiroRes, tribunaisRes, modelosRes] = await Promise.all([
                        supabaseClient.from('clients').select('data').eq('user_id', userId),
                        supabaseClient.from('processes').select('data').eq('user_id', userId),
                        supabaseClient.from('financials').select('data').eq('user_id', userId),
                        supabaseClient.from('tribunais_conhecimento').select('data').eq('user_id', userId),
                        supabaseClient.from('modelos_documento').select('data').eq('user_id', userId),
                    ]);
                    if (cancelado) return;
                    const erro = clientesRes.error || processosRes.error || financeiroRes.error || tribunaisRes.error || modelosRes.error;
                    if (erro) {
                        console.error('Erro ao carregar dados do Supabase:', erro);
                        setErroCarregamento(erro.message || 'Falha ao carregar seus dados.');
                    }
                    setClients((clientesRes.data || []).map(r => r.data));
                    setProcesses((processosRes.data || []).map(r => r.data));
                    setFinancials((financeiroRes.data || []).map(r => r.data));
                    setTribunaisConhecimento((tribunaisRes.data || []).map(r => r.data));
                    setModelosDocumento((modelosRes.data || []).map(r => r.data));
                    setDadosCarregados(true);
                }
                carregarDados();
                return () => { cancelado = true; };
            }, [userId]);

            useEffect(() => {
                localStorage.setItem('jc_alertas', JSON.stringify(alertas));
            }, [alertas]);

            useEffect(() => {
                localStorage.setItem('jc_oabs', JSON.stringify(oabsMonitoradas));
            }, [oabsMonitoradas]);

            const showNotification = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3500);
            };

            // Grava um registro (cliente/processo/financeiro) no Supabase. Atualização
            // otimista: o estado local já mudou antes desta função ser chamada — se a
            // gravação falhar (sem internet, etc.), só avisamos por toast, sem travar a tela.
            const salvarNoSupabase = async (tabela, objeto) => {
                const { error } = await supabaseClient
                    .from(tabela)
                    .upsert({ id: objeto.id, user_id: userId, data: objeto, updated_at: new Date().toISOString() });
                if (error) {
                    console.error(`Erro ao sincronizar com ${tabela}:`, error);
                    showNotification(`Aviso: alteração não sincronizada com a nuvem (${error.message}).`);
                }
            };

            const removerDoSupabase = async (tabela, id) => {
                const { error } = await supabaseClient.from(tabela).delete().eq('id', id);
                if (error) {
                    console.error(`Erro ao remover de ${tabela}:`, error);
                    showNotification(`Aviso: remoção não sincronizada com a nuvem (${error.message}).`);
                }
            };

            // Base de conhecimento de tribunais/varas — anotações livres do(a) advogado(a)
            const handleSalvarTribunal = (registro) => {
                const obj = registro.id
                    ? registro
                    : { ...registro, id: 'trib-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7), criadoEm: new Date().toISOString().split('T')[0] };
                setTribunaisConhecimento(prev => {
                    const existe = prev.some(t => t.id === obj.id);
                    return existe ? prev.map(t => (t.id === obj.id ? obj : t)) : [obj, ...prev];
                });
                salvarNoSupabase('tribunais_conhecimento', obj);
                showNotification('Anotação de tribunal salva!');
                return obj;
            };

            const handleRemoverTribunal = (id) => {
                setTribunaisConhecimento(prev => prev.filter(t => t.id !== id));
                removerDoSupabase('tribunais_conhecimento', id);
                showNotification('Anotação removida.');
            };

            // Modelos de documento próprios (além dos fixos do app)
            const handleSalvarModelo = (registro) => {
                const obj = registro.id
                    ? registro
                    : { ...registro, id: 'modelo-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7), criadoEm: new Date().toISOString().split('T')[0] };
                setModelosDocumento(prev => {
                    const existe = prev.some(m => m.id === obj.id);
                    return existe ? prev.map(m => (m.id === obj.id ? obj : m)) : [obj, ...prev];
                });
                salvarNoSupabase('modelos_documento', obj);
                showNotification('Modelo salvo!');
                return obj;
            };

            const handleRemoverModelo = (id) => {
                setModelosDocumento(prev => prev.filter(m => m.id !== id));
                removerDoSupabase('modelos_documento', id);
                showNotification('Modelo removido.');
            };

            // Form Handlers
            const handleAddClient = (newClient) => {
                const clientObj = { ...newClient, id: 'cli-' + Date.now(), dataCadastro: new Date().toISOString().split('T')[0] };
                setClients([clientObj, ...clients]);
                setClientModal(null);
                showNotification('Cliente cadastrado com sucesso!');
                salvarNoSupabase('clients', clientObj);
            };

            const handleUpdateClient = (id, patch) => {
                const novoObjeto = { ...(clients.find(c => c.id === id) || {}), ...patch, id };
                setClients(clients.map(c => (c.id === id ? novoObjeto : c)));
                setClientModal(null);
                showNotification('Cliente atualizado com sucesso!');
                salvarNoSupabase('clients', novoObjeto);
            };

            const handleRemoveClient = (id) => {
                if (!window.confirm('Excluir este cliente? Os processos já vinculados a ele não serão apagados.')) return;
                setClients(clients.filter(c => c.id !== id));
                removerDoSupabase('clients', id);
                showNotification('Cliente removido.');
            };

            const handleAddProcess = (newProcess) => {
                const procObj = { ...newProcess, id: 'proc-' + Date.now(), dataCadastro: new Date().toISOString().split('T')[0] };
                setProcesses([procObj, ...processes]);
                setProcessModal(null);
                showNotification('Processo cadastrado com sucesso!');
                salvarNoSupabase('processes', procObj);
            };

            const handleUpdateProcess = (id, patch) => {
                const novoObjeto = { ...(processes.find(p => p.id === id) || {}), ...patch, id };
                setProcesses(processes.map(p => (p.id === id ? novoObjeto : p)));
                setProcessModal(null);
                showNotification('Processo atualizado com sucesso!');
                salvarNoSupabase('processes', novoObjeto);
            };

            const handleAddFinancial = (newItem) => {
                const finObj = { ...newItem, id: 'fin-' + Date.now() };
                setFinancials([finObj, ...financials]);
                setShowFinancialModal(false);
                showNotification('Lançamento financeiro registrado!');
                salvarNoSupabase('financials', finObj);
            };

            const handleImportProcesses = (novosProcessos) => {
                const numerosExistentes = new Set(processes.map(p => p.numero));
                const processosNovos = novosProcessos.filter(p => !numerosExistentes.has(p.numero));
                const duplicados = novosProcessos.length - processosNovos.length;

                if (processosNovos.length === 0) {
                    showNotification('Nenhum processo novo: todos já estavam cadastrados.');
                    return;
                }

                // Extrai clientes automaticamente: um processo importado do TJRJ/DJEN traz
                // o nome da parte em clienteNome, mas não veio do CRM (sem clienteId). Casa
                // com um cliente já cadastrado pelo nome (ignorando maiúsculas/espaços), ou
                // cria um cadastro novo só com o nome preenchido — o resto (documento,
                // contato etc.) fica pra completar depois em Clientes.
                const normalizarNome = (nome) => (nome || '').trim().toLowerCase();
                const clientesNovos = [];
                const processosComCliente = processosNovos.map(p => {
                    const nomeValido = p.clienteNome && p.clienteNome.trim() && p.clienteNome !== 'Parte não identificada';
                    if (p.clienteId || !nomeValido) return p;

                    const alvo = normalizarNome(p.clienteNome);
                    let cliente = clients.find(c => normalizarNome(c.nome) === alvo)
                        || clientesNovos.find(c => normalizarNome(c.nome) === alvo);

                    if (!cliente) {
                        cliente = {
                            id: 'cli-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
                            nome: p.clienteNome.trim(),
                            tipo: 'PF',
                            documento: '',
                            email: '',
                            telefone: '',
                            cidade: '',
                            uf: p.uf || '',
                            endereco: '',
                            dataCadastro: new Date().toISOString().split('T')[0],
                            origem: 'importado',
                        };
                        clientesNovos.push(cliente);
                    }
                    return { ...p, clienteId: cliente.id };
                });

                if (clientesNovos.length > 0) {
                    setClients([...clientesNovos, ...clients]);
                    clientesNovos.forEach(c => salvarNoSupabase('clients', c));
                }

                setProcesses([...processosComCliente, ...processes]);
                setActiveTab('processos');
                showNotification(
                    `${processosComCliente.length} processo(s) importado(s) do TJRJ` +
                    (clientesNovos.length > 0 ? ` — ${clientesNovos.length} cliente(s) novo(s) cadastrado(s) automaticamente` : '') +
                    (duplicados > 0 ? ` (${duplicados} já existia(m) e foi(ram) ignorado(s))` : '') + '.'
                );
                processosComCliente.forEach(p => salvarNoSupabase('processes', p));
            };

            const handleAddOab = (oab, uf, label) => {
                const oabLimpa = oab.replace(/\D/g, '');
                if (!oabLimpa) return;
                if (oabsMonitoradas.some(o => o.oab === oabLimpa && o.uf === uf)) {
                    showNotification('Esta OAB já está sendo monitorada.');
                    return;
                }
                setOabsMonitoradas([...oabsMonitoradas, { id: 'oab-' + Date.now(), oab: oabLimpa, uf, label: label || `OAB ${oabLimpa}/${uf}` }]);
            };

            const handleRemoveOab = (id) => {
                setOabsMonitoradas(oabsMonitoradas.filter(o => o.id !== id));
            };

            const handleMergeAlertas = (novos) => {
                setAlertas(prev => {
                    const existentesPorId = new Map(prev.map(a => [a.id, a]));
                    for (const novo of novos) {
                        const existente = existentesPorId.get(novo.id);
                        // Preserva o status (tratada/descartada) se o alerta já era conhecido.
                        existentesPorId.set(novo.id, existente ? { ...novo, status: existente.status, processoVinculadoId: existente.processoVinculadoId } : novo);
                    }
                    return [...existentesPorId.values()].sort((a, b) => (b.data || '').localeCompare(a.data || ''));
                });
            };

            const handleAtualizarStatusAlerta = (id, status) => {
                setAlertas(alertas.map(a => a.id === id ? { ...a, status } : a));
            };

                const processo = {
                    id: (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : ('proc-' + Date.now() + '-' + Math.random().toString(36).slice(2)),
                    numero: alerta.numero,
                    clienteId: null,
                    clienteNome: alerta.poloAtivo || 'Parte não identificada',
                    area: 'Cível',
                    vara: alerta.orgaoJulgador || '',
                    acao: alerta.tipo ? `${alerta.tipo} - ${alerta.texto || ''}`.slice(0, 180) : (alerta.texto || 'Consulta TJRJ'),
                    status: 'Ativo',
                    fase: 'Publicado no DJEN',
                    valorCausa: 0,
                    honorariosContratados: 0,
                    proximoPrazo: null,
                    descricaoPrazo: '',
                    dataCadastro: new Date().toISOString().split('T')[0],
                    origem: 'tjrj',
                    kanbanStatus: 'A Fazer',

                handleImportProcesses([processo]);

                        return itemAtualizado;

        function ConfigurarIAModal({ onClose }) {
            const [provedor, setProvedor] = useState('gemini');
            const [chave, setChave] = useState('');
            const [salvando, setSalvando] = useState(false);
            const [mensagem, setMensagem] = useState(null);
            const dados = DADOS_TUTORIAL_IA[provedor];

            const salvar = async () => {
                if (!chave.trim()) { setMensagem({ tipo: 'erro', texto: 'Cole sua chave antes de salvar.' }); return; }
                setSalvando(true);
                const resultado = await setSecret(dados.chave, chave.trim());
                setSalvando(false);
                if (resultado.ok) {
                    setMensagem({ tipo: 'sucesso', texto: `Chave do ${dados.nome} conectada com sucesso! Gerações ilimitadas a partir de agora.` });
                    setChave('');
                } else {
                    setMensagem({ tipo: 'erro', texto: resultado.erro || 'Falha ao salvar.' });
                }
            };

            return (
                <div className="fixed inset-0 bg-navy-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">

                        <div className="flex bg-stone-100 rounded-xl p-1">
                            {Object.keys(DADOS_TUTORIAL_IA).map(p => (
                                <button key={p} type="button" onClick={() => { setProvedor(p); setMensagem(null); }} className={`flex-1 py-2 rounded-lg text-sm font-semibold transition ${provedor === p ? 'bg-white shadow-sm text-stone-900' : 'text-stone-500'}`}>
                                    {DADOS_TUTORIAL_IA[p].nome}

                        </div>

                                        <p className="text-[11px] text-stone-500 mt-0.5">{s[1]}</p>

                                {mensagem.texto}

                        <div>
                            <label className="block text-xs font-semibold text-stone-600 mb-1">Cole sua chave aqui</label>

                            <button onClick={onClose} className="px-4 py-2 bg-stone-100 text-stone-700 text-xs font-semibold rounded-lg">Fechar</button>
                            <button onClick={salvar} disabled={salvando} className="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-stone-950 font-bold rounded-lg text-sm disabled:opacity-50">

                            </button>
                        </div>
                    </div>
                </div>
            );
        }

            return (
                <div className="space-y-3">

                        return (
                            <div key={area} className="space-y-1">
                                <div className="flex justify-between text-xs font-medium">
                                    <span className="text-stone-700">{area}</span>
